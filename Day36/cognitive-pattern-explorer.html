<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Pattern Explorer</title>
<style>
  :root{
    --ink:#1c2b2a;
    --bg-0:#eef2ee;
    --bg-1:#e2ebe6;
    --paper:#f8faf7;
    --moss:#4f6f5f;
    --moss-dark:#37564a;
    --clay:#c98a5e;
    --dusk:#7c6f9e;
    --line: rgba(28,43,42,0.12);
    --shadow: 0 10px 30px rgba(28,43,42,0.10);
    --radius: 18px;
    --dur-1: 220ms;
    --dur-2: 420ms;
    --ease: cubic-bezier(.22,.8,.32,1);
    --stress-accent:#b25b45;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype", Palatino, Georgia, serif;
    background: radial-gradient(1200px 800px at 15% -10%, var(--bg-1), var(--bg-0) 60%);
    color: var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .sans{ font-family: "Avenir Next","Segoe UI",-apple-system,Helvetica,Arial,sans-serif; }

  /* ---------- ambient background ---------- */
  #ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:0.55;
  }
  #ambient span{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--moss);
    opacity:0.25;
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform: translateY(0) translateX(0) scale(1); }
    to{ transform: translateY(-120vh) translateX(30px) scale(1.4); }
  }

  body.stress{
    background: radial-gradient(1200px 800px at 15% -10%, #f1e6e0, #f7efe9 60%);
  }
  body.stress #ambient span{ background: var(--stress-accent); }

  /* ---------- layout shell ---------- */
  #app{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px clamp(16px,4vw,40px);
    gap:16px;
  }
  .brand{
    font-size:1.05rem; letter-spacing:0.03em;
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{
    width:14px;height:14px;border-radius:50%;
    background: conic-gradient(var(--moss), var(--dusk), var(--clay), var(--moss));
    box-shadow: 0 0 0 4px rgba(79,111,95,0.12);
  }

  .progress-wrap{
    flex:1; max-width:420px; margin: 0 20px;
    display:flex; align-items:center; gap:10px;
  }
  .progress-track{
    flex:1; height:6px; border-radius:6px;
    background: var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--moss), var(--dusk));
    border-radius:6px;
    transition: width var(--dur-2) var(--ease);
  }
  body.stress .progress-fill{ background: linear-gradient(90deg, var(--stress-accent), var(--clay)); }
  .progress-label{ font-size:0.72rem; opacity:0.6; white-space:nowrap;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px clamp(16px,4vw,40px) 60px;
  }

  .screen{
    width:100%;
    max-width:920px;
    animation: rise var(--dur-2) var(--ease);
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform:none; }
  }
  .screen.leaving{
    animation: fall var(--dur-1) var(--ease) forwards;
  }
  @keyframes fall{
    to{ opacity:0; transform: translateY(-10px); }
  }

  h1.display{
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height:1.15;
    margin: 0 0 12px;
    font-weight:500;
  }
  p.lead{
    font-size:1.05rem;
    line-height:1.6;
    color: rgba(28,43,42,0.72);
    max-width: 60ch;
    margin: 0 0 28px;
  }
  .eyebrow{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    text-transform:uppercase;
    font-size:0.72rem;
    letter-spacing:0.16em;
    color: var(--moss-dark);
    margin-bottom:10px;
    display:block;
  }
  body.stress .eyebrow{ color: var(--stress-accent); }

  /* ---------- buttons ---------- */
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    border:none;
    border-radius: 999px;
    padding: 13px 26px;
    font-size:0.95rem;
    letter-spacing:0.01em;
    background: var(--moss);
    color:#fff;
    box-shadow: var(--shadow);
    transition: transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease), opacity var(--dur-1);
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{ transform: translateY(0); }
  .btn.ghost{
    background: transparent;
    color: var(--ink);
    box-shadow: none;
    border: 1px solid var(--line);
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  body.stress .btn{ background: var(--stress-accent); }
  .btn:focus-visible, .card:focus-visible, .mode-card:focus-visible, [tabindex]:focus-visible{
    outline: 3px solid var(--dusk);
    outline-offset: 3px;
  }

  .row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:34px; gap:12px; }

  /* ---------- start screen ---------- */
  .mode-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:16px;
    margin: 26px 0 8px;
  }
  @media (max-width:560px){ .mode-grid{ grid-template-columns: 1fr; } }
  .mode-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    text-align:left;
    box-shadow: var(--shadow);
    transition: transform var(--dur-1) var(--ease), border-color var(--dur-1);
  }
  .mode-card:hover{ transform: translateY(-3px); }
  .mode-card.selected{ border-color: var(--moss); box-shadow: 0 0 0 2px var(--moss), var(--shadow); }
  .mode-card h3{ margin:0 0 6px; font-weight:500; }
  .mode-card p{ margin:0; font-size:0.88rem; color: rgba(28,43,42,0.65); font-family:"Avenir Next","Segoe UI",sans-serif; line-height:1.5; }

  /* ---------- chapter 1: scenario cards ---------- */
  .scenario-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(20px,4vw,32px);
    box-shadow: var(--shadow);
  }
  .options{
    display:flex; flex-direction:column; gap:12px; margin-top:22px;
  }
  .option-btn{
    text-align:left;
    background: var(--bg-0);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    font-size:1rem;
    line-height:1.45;
    color:var(--ink);
    transition: background var(--dur-1), border-color var(--dur-1), transform var(--dur-1);
    font-family: inherit;
  }
  .option-btn:hover{ background:#fff; transform: translateX(3px); }
  .option-btn.chosen{ border-color: var(--moss); background:#fff; }
  body.stress .option-btn.chosen{ border-color: var(--stress-accent); }

  /* ---------- chapter 2: draggable priority cards ---------- */
  .dnd-layout{
    display:grid; grid-template-columns: 1fr 1fr; gap:24px; margin-top:24px;
  }
  @media (max-width:680px){ .dnd-layout{ grid-template-columns:1fr; } }
  .pool, .dropzone-list{
    min-height: 260px;
    background: var(--bg-0);
    border-radius: var(--radius);
    border: 1px dashed var(--line);
    padding: 14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .dnd-col h4{
    margin:0 0 10px; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.1em;
    font-family:"Avenir Next","Segoe UI",sans-serif; color: rgba(28,43,42,0.55);
  }
  .drag-card{
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding: 13px 14px;
    box-shadow: 0 3px 10px rgba(28,43,42,0.06);
    cursor: grab;
    display:flex; align-items:center; gap:10px;
    font-size:0.95rem;
    touch-action: none;
    user-select:none;
    transition: box-shadow var(--dur-1), transform var(--dur-1);
  }
  .drag-card:active{ cursor: grabbing; }
  .drag-card .grip{ opacity:0.35; font-size:0.9em; }
  .drag-card.dragging{
    opacity:0.5;
  }
  .drag-card.ghost-floating{
    position:fixed;
    z-index:999;
    pointer-events:none;
    box-shadow: 0 12px 24px rgba(28,43,42,0.22);
    transform: scale(1.03) rotate(-1deg);
  }
  .dropzone-list.over{ border-color: var(--moss); background: rgba(79,111,95,0.06); }
  .slot-index{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.72rem;
    width:20px; height:20px; border-radius:50%;
    background: var(--moss); color:#fff;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  body.stress .slot-index{ background: var(--stress-accent); }
  .empty-hint{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.82rem; color: rgba(28,43,42,0.4);
    text-align:center; padding: 30px 10px;
  }

  /* ---------- chapter 3: timeline mapping ---------- */
  .timeline-card{
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(20px,4vw,30px);
    box-shadow: var(--shadow);
  }
  .timeline-track{
    position:relative;
    margin: 40px 6px 16px;
    height: 6px;
    border-radius:6px;
    background: var(--bg-0);
    border:1px solid var(--line);
  }
  .timeline-labels{
    display:flex; justify-content:space-between;
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.78rem; color: rgba(28,43,42,0.55);
    margin-top:10px;
  }
  .handle{
    position:absolute; top:50%; left:0%;
    width:30px; height:30px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: var(--moss);
    box-shadow: 0 4px 12px rgba(28,43,42,0.25);
    cursor:grab;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:0.75rem; font-family:"Avenir Next","Segoe UI",sans-serif;
    touch-action:none;
    transition: box-shadow var(--dur-1);
  }
  .handle:active{ cursor:grabbing; box-shadow: 0 6px 18px rgba(28,43,42,0.35); }
  body.stress .handle{ background: var(--stress-accent); }
  .timeline-block{ margin-bottom: 34px; }
  .timeline-block:last-child{ margin-bottom:6px; }
  .timeline-q{ font-size:1rem; margin-bottom:2px; }

  /* ---------- journal / final ---------- */
  .journal{
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(22px,4vw,36px);
    box-shadow: var(--shadow);
  }
  .bars{
    display:flex; flex-direction:column; gap:14px; margin: 22px 0 30px;
  }
  .bar-row{ display:flex; align-items:center; gap:12px; }
  .bar-label{
    width: 190px; flex-shrink:0;
    font-family:"Avenir Next","Segoe UI",sans-serif; font-size:0.86rem;
  }
  .bar-track{
    flex:1; height:10px; border-radius:8px; background: var(--bg-0); overflow:hidden;
    border:1px solid var(--line);
  }
  .bar-fill{
    height:100%; width:0%; border-radius:8px;
    background: linear-gradient(90deg, var(--moss), var(--dusk));
    transition: width 900ms var(--ease);
  }
  body.stress .bar-fill{ background: linear-gradient(90deg, var(--stress-accent), var(--clay)); }
  .bar-pct{ width:44px; text-align:right; font-family:"Avenir Next","Segoe UI",sans-serif; font-size:0.85rem; opacity:0.7; }

  .insight-block{
    border-left: 3px solid var(--moss);
    padding: 4px 0 4px 18px;
    margin: 22px 0;
  }
  body.stress .insight-block{ border-color: var(--stress-accent); }
  .insight-block h4{ margin:0 0 6px; font-weight:500; }
  .insight-block p{ margin:0; font-size:0.95rem; line-height:1.6; color: rgba(28,43,42,0.75); }

  .journal-note{
    margin-top:26px;
  }
  .journal-note label{
    display:block; font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em;
    color: rgba(28,43,42,0.55); margin-bottom:8px;
  }
  textarea{
    width:100%; min-height:100px; resize:vertical;
    font-family: inherit; font-size:0.98rem;
    border:1px solid var(--line); border-radius:12px;
    padding:14px; background: var(--bg-0); color:var(--ink);
  }
  textarea:focus-visible{ outline: 2px solid var(--moss); outline-offset:1px; }

  .disclaimer{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.76rem;
    color: rgba(28,43,42,0.5);
    margin-top: 24px;
    line-height:1.5;
  }

  .sr-only{
    position:absolute; width:1px;height:1px; padding:0;margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .live-hint{
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-size:0.78rem; color: rgba(28,43,42,0.45); margin-top:10px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count:1 !important; transition-duration: 0.01ms !important; }
    #ambient{ display:none; }
  }
</style>
</head>
<body>

<div id="ambient" aria-hidden="true"></div>

<div id="app">
  <header class="topbar sans">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Cognitive Pattern Explorer</div>
    <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar" aria-valuenow="0" aria-label="Overall progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">Start</span>
    </div>
    <div style="width:1px" aria-hidden="true"></div>
  </header>

  <main>
    <div class="screen" id="screen"></div>
  </main>
</div>

<div class="sr-only" aria-live="polite" id="liveRegion"></div>

<script>
(function(){
"use strict";

/* =====================================================
   DATA
===================================================== */

const TRAITS = {
  analytical:   { key:"analytical",   name:"Analytical Thinker",        blurb:"You tend to break things down, weigh evidence, and look for the logic before deciding." },
  emotional:    { key:"emotional",    name:"Emotional Intuitive",       blurb:"You often lead with felt sense — what a situation feels like tends to guide you before the details do." },
  overthinking: { key:"overthinking", name:"Overthinking Loop Style",   blurb:"You often revisit a decision from many angles, which can surface insight but can also loop without landing." },
  action:       { key:"action",       name:"Action-First Decision Maker", blurb:"You tend to move quickly once a direction feels roughly right, adjusting course as you go." },
  balanced:     { key:"balanced",     name:"Balanced Reflective Thinker", blurb:"You tend to pause, consider a few angles, then commit — without over-analyzing or rushing." }
};

const TRAIT_ORDER = ["analytical","emotional","overthinking","action","balanced"];

// Chapter 1 scenarios — each option maps to a trait weight
const CH1_SCENARIOS = [
  {
    id:"c1_1",
    prompt:"A friend cancels plans at the last minute with a vague excuse. What's your first internal reaction?",
    options:[
      { text:"I start listing possible reasons and weigh which is most likely true.", trait:"analytical" },
      { text:"I feel a pang of hurt before I even think about why.", trait:"emotional" },
      { text:"I replay the message a few times, wondering what I might have done.", trait:"overthinking" },
      { text:"I shrug, text back 'no worries', and move on with my day.", trait:"action" }
    ]
  },
  {
    id:"c1_2",
    prompt:"You're handed a project with an unclear brief and a tight deadline.",
    options:[
      { text:"I map out what's known and unknown before touching any work.", trait:"analytical" },
      { text:"I go with my gut on what 'feels' right for the outcome.", trait:"emotional" },
      { text:"I imagine several versions of how it could go wrong first.", trait:"overthinking" },
      { text:"I start building something rough immediately and refine as I go.", trait:"action" }
    ]
  },
  {
    id:"c1_3",
    prompt:"Choosing between two job offers, one stable and one exciting but uncertain.",
    options:[
      { text:"I build a pros-and-cons comparison across several factors.", trait:"analytical" },
      { text:"I picture myself in each role and notice which one lights me up.", trait:"emotional" },
      { text:"I keep circling back, unsure I'll ever feel fully certain.", trait:"overthinking" },
      { text:"I pick the one that feels right in the moment and commit.", trait:"action" },
      { text:"I sit with both for a day, then decide calmly.", trait:"balanced" }
    ]
  },
  {
    id:"c1_4",
    prompt:"Someone gives you critical feedback on something you made.",
    options:[
      { text:"I ask clarifying questions to understand exactly what they mean.", trait:"analytical" },
      { text:"I notice my mood shift before I process the actual words.", trait:"emotional" },
      { text:"I replay the conversation for the rest of the day.", trait:"overthinking" },
      { text:"I make a quick change and move forward without dwelling.", trait:"action" },
      { text:"I take a breath, consider it, and respond a bit later.", trait:"balanced" }
    ]
  },
  {
    id:"c1_5",
    prompt:"You wake up with no plans on a free day.",
    options:[
      { text:"I make a small list of options and pick the most sensible one.", trait:"analytical" },
      { text:"I check in with how I feel, then follow that mood.", trait:"emotional" },
      { text:"I consider many possibilities and struggle to settle on one.", trait:"overthinking" },
      { text:"I just start doing something rather than planning it out.", trait:"action" },
      { text:"I loosely plan the day, staying open to change.", trait:"balanced" }
    ]
  }
];

// Chapter 2 — priority cards to rank (drag from pool into ranked list)
const CH2_CARDS = [
  { id:"p_clarity", label:"Having a clear plan before I act", trait:"analytical" },
  { id:"p_feeling",  label:"Trusting how a decision feels", trait:"emotional" },
  { id:"p_speed",    label:"Moving quickly once I have a direction", trait:"action" },
  { id:"p_certainty",label:"Feeling fully certain before committing", trait:"overthinking" },
  { id:"p_balance",  label:"Weighing a few options, then deciding calmly", trait:"balanced" },
  { id:"p_data",     label:"Gathering enough information first", trait:"analytical" }
];

// Chapter 3 — timeline sliders (0-100), each mapped to two traits at opposite ends
const CH3_SLIDERS = [
  {
    id:"t_pace",
    question:"When facing a decision, where do you usually land?",
    leftLabel:"Reflect for a long while",
    rightLabel:"Decide almost instantly",
    leftTrait:"overthinking",
    rightTrait:"action"
  },
  {
    id:"t_source",
    question:"What do you lean on most when deciding?",
    leftLabel:"Logic and evidence",
    rightLabel:"Feeling and instinct",
    leftTrait:"analytical",
    rightTrait:"emotional"
  },
  {
    id:"t_revisit",
    question:"After deciding, how often do you revisit the choice?",
    leftLabel:"Rarely look back",
    rightLabel:"Replay it often",
    leftTrait:"balanced",
    rightTrait:"overthinking"
  },
  {
    id:"t_calm",
    question:"Under pressure, what tends to happen?",
    leftLabel:"I stay steady and measured",
    rightLabel:"I feel pulled in many directions",
    leftTrait:"balanced",
    rightTrait:"emotional"
  }
];

/* =====================================================
   STATE
===================================================== */

const state = {
  mode: "calm", // calm | stress
  step: 0, // index into FLOW
  scores: { analytical:0, emotional:0, overthinking:0, action:0, balanced:0 },
  ch1Answers: {},         // scenarioId -> trait chosen
  ch2Order: [],           // ordered array of card ids (ranked, top = highest priority)
  ch3Values: {},          // sliderId -> 0-100
  journalNote: ""
};

// Flow definition
const FLOW = ["start","ch1","ch2","ch3","final"];

/* =====================================================
   UTIL
===================================================== */

function announce(msg){
  const el = document.getElementById("liveRegion");
  el.textContent = "";
  requestAnimationFrame(()=>{ el.textContent = msg; });
}

function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

function addScore(trait, amount){
  if(state.scores[trait] === undefined) return;
  state.scores[trait] += amount;
}

function resetScoresFromScratch(){
  // recompute entirely from stored answers, so users can go back & change things safely
  state.scores = { analytical:0, emotional:0, overthinking:0, action:0, balanced:0 };

  // chapter 1: each answer = 3 points
  Object.values(state.ch1Answers).forEach(trait=>{
    addScore(trait, 3);
  });

  // chapter 2: rank position weight (top ranked = more points)
  state.ch2Order.forEach((cardId, idx)=>{
    const card = CH2_CARDS.find(c=>c.id===cardId);
    if(!card) return;
    const weight = Math.max(0, CH2_CARDS.length - idx); // top gets highest weight
    addScore(card.trait, weight * 0.8);
  });

  // chapter 3: slider position blends between two traits, worth 4 points total
  CH3_SLIDERS.forEach(s=>{
    const v = state.ch3Values[s.id];
    if(v === undefined) return;
    const rightWeight = v/100;
    const leftWeight = 1 - rightWeight;
    addScore(s.leftTrait, leftWeight * 4);
    addScore(s.rightTrait, rightWeight * 4);
  });
}

function getPercentages(){
  const total = TRAIT_ORDER.reduce((sum,k)=> sum + Math.max(0,state.scores[k]), 0);
  const pct = {};
  TRAIT_ORDER.forEach(k=>{
    pct[k] = total > 0 ? Math.round((Math.max(0,state.scores[k]) / total) * 100) : 0;
  });
  // fix rounding so it sums to 100
  const diff = 100 - TRAIT_ORDER.reduce((s,k)=>s+pct[k],0);
  if(total > 0){
    const topKey = TRAIT_ORDER.slice().sort((a,b)=>pct[b]-pct[a])[0];
    pct[topKey] += diff;
  }
  return pct;
}

function updateProgress(){
  const idx = FLOW.indexOf(currentFlowKey());
  const pct = Math.round((idx / (FLOW.length-1)) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressBar").setAttribute("aria-valuenow", pct);
  const labels = { start:"Start", ch1:"Chapter 1 of 3", ch2:"Chapter 2 of 3", ch3:"Chapter 3 of 3", final:"Reflection Journal" };
  document.getElementById("progressLabel").textContent = labels[currentFlowKey()] || "";
}

function currentFlowKey(){ return FLOW[state.step]; }

function goTo(stepIndex){
  const screenEl = document.getElementById("screen");
  const doRender = ()=>{
    state.step = stepIndex;
    render();
    updateProgress();
    window.scrollTo({top:0, behavior: prefersReducedMotion() ? "auto":"smooth"});
  };
  if(prefersReducedMotion()){
    doRender();
  } else {
    screenEl.classList.add("leaving");
    setTimeout(doRender, 200);
  }
}

function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function applyModeClass(){
  document.body.classList.toggle("stress", state.mode === "stress");
}

/* =====================================================
   AMBIENT PARTICLES
===================================================== */
function buildAmbient(){
  const wrap = document.getElementById("ambient");
  wrap.innerHTML = "";
  const count = window.innerWidth < 600 ? 14 : 26;
  for(let i=0;i<count;i++){
    const s = document.createElement("span");
    const left = Math.random()*100;
    const size = 3 + Math.random()*6;
    const dur = 14 + Math.random()*18;
    const delay = -Math.random()*dur;
    s.style.left = left + "vw";
    s.style.bottom = "-5vh";
    s.style.width = size+"px";
    s.style.height = size+"px";
    s.style.animationDuration = dur+"s";
    s.style.animationDelay = delay+"s";
    wrap.appendChild(s);
  }
}

/* =====================================================
   RENDER: ROUTER
===================================================== */

function render(){
  applyModeClass();
  const screen = document.getElementById("screen");
  screen.classList.remove("leaving");
  const key = currentFlowKey();
  if(key === "start") renderStart(screen);
  else if(key === "ch1") renderCh1(screen);
  else if(key === "ch2") renderCh2(screen);
  else if(key === "ch3") renderCh3(screen);
  else if(key === "final") renderFinal(screen);
}

/* =====================================================
   START SCREEN
===================================================== */

function renderStart(screen){
  screen.innerHTML = `
    <span class="eyebrow sans">Before you begin</span>
    <h1 class="display">Explore how you think — gently.</h1>
    <p class="lead">This is a short, reflective journey through three small chapters. There are no right answers, no scores that judge you, and nothing here is a diagnosis. Just a mirror for noticing your own patterns.</p>

    <p class="lead sans" style="font-size:0.95rem;">Choose the mood you'd like the space to hold while you explore:</p>

    <div class="mode-grid" role="radiogroup" aria-label="Choose a mode">
      <button class="mode-card sans ${state.mode==='calm'?'selected':''}" id="modeCalm" role="radio" aria-checked="${state.mode==='calm'}">
        <h3>🌿 Calm Mode</h3>
        <p>Soft palette, slower pacing, muted ambient motion.</p>
      </button>
      <button class="mode-card sans ${state.mode==='stress'?'selected':''}" id="modeStress" role="radio" aria-checked="${state.mode==='stress'}">
        <h3>🔥 Stress Mode</h3>
        <p>Warmer palette, slightly quicker pacing — for when things feel more charged.</p>
      </button>
    </div>

    <div class="nav-row">
      <span class="sans" style="font-size:0.8rem; opacity:0.55;">Takes about 4–6 minutes</span>
      <button class="btn sans" id="beginBtn">Begin Chapter 1 →</button>
    </div>
  `;

  document.getElementById("modeCalm").addEventListener("click", ()=>{ state.mode="calm"; buildAmbient(); render(); });
  document.getElementById("modeStress").addEventListener("click", ()=>{ state.mode="stress"; buildAmbient(); render(); });
  document.getElementById("beginBtn").addEventListener("click", ()=> goTo(1));
}

/* =====================================================
   CHAPTER 1 — Scenario cards
===================================================== */

let ch1Index = 0;

function renderCh1(screen){
  const scenario = CH1_SCENARIOS[ch1Index];
  const answered = state.ch1Answers[scenario.id];

  screen.innerHTML = `
    <span class="eyebrow sans">Chapter 1 · Discover your thinking style</span>
    <h1 class="display" style="font-size:1.5rem;">Scenario ${ch1Index+1} of ${CH1_SCENARIOS.length}</h1>
    <div class="scenario-card">
      <p style="font-size:1.15rem; line-height:1.6; margin:0 0 4px;">${scenario.prompt}</p>
      <div class="options" role="group" aria-label="Choose the response closest to you">
        ${scenario.options.map((opt,i)=>`
          <button class="option-btn sans ${answered===opt.trait?'chosen':''}" data-trait="${opt.trait}" data-idx="${i}">
            ${opt.text}
          </button>
        `).join("")}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn ghost sans" id="backBtn" ${ch1Index===0 ? "" : ""}>${ch1Index===0 ? "← Back to start" : "← Previous"}</button>
      <button class="btn sans" id="nextBtn" ${answered ? "" : "disabled"}>${ch1Index === CH1_SCENARIOS.length-1 ? "Continue to Chapter 2 →" : "Next →"}</button>
    </div>
  `;

  screen.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.ch1Answers[scenario.id] = btn.dataset.trait;
      resetScoresFromScratch();
      announce("Response recorded.");
      renderCh1(screen);
    });
    btn.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); btn.click(); }
    });
  });

  document.getElementById("backBtn").addEventListener("click", ()=>{
    if(ch1Index === 0){ goTo(0); }
    else { ch1Index--; renderCh1(screen); }
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    if(!state.ch1Answers[scenario.id]) return;
    if(ch1Index === CH1_SCENARIOS.length-1){
      goTo(2);
    } else {
      ch1Index++;
      renderCh1(screen);
    }
  });
}

/* =====================================================
   CHAPTER 2 — Draggable priority ranking
===================================================== */

function renderCh2(screen){
  if(state.ch2Order.length === 0){
    state.ch2Order = []; // ranked list starts empty; pool holds all cards initially
  }
  const poolIds = CH2_CARDS.map(c=>c.id).filter(id=> !state.ch2Order.includes(id));

  screen.innerHTML = `
    <span class="eyebrow sans">Chapter 2 · Choose your priorities</span>
    <h1 class="display" style="font-size:1.5rem;">Drag the cards into the order that feels most true to you.</h1>
    <p class="lead sans" style="font-size:0.92rem;">Top = most like you. You can reorder anytime. On touch devices, press and hold, then drag.</p>

    <div class="dnd-layout">
      <div class="dnd-col">
        <h4>Available</h4>
        <div class="pool" id="pool" data-zone="pool">
          ${poolIds.length===0 ? `<div class="empty-hint">All cards ranked ✓</div>` : ""}
        </div>
      </div>
      <div class="dnd-col">
        <h4>Your order (most → least like you)</h4>
        <div class="dropzone-list" id="ranked" data-zone="ranked">
          ${state.ch2Order.length===0 ? `<div class="empty-hint">Drag cards here to rank them</div>` : ""}
        </div>
      </div>
    </div>

    <div class="live-hint sans" id="ch2Hint">${state.ch2Order.length} of ${CH2_CARDS.length} ranked.</div>

    <div class="nav-row">
      <button class="btn ghost sans" id="backBtn">← Previous</button>
      <button class="btn sans" id="nextBtn" ${state.ch2Order.length===CH2_CARDS.length ? "" : "disabled"}>Continue to Chapter 3 →</button>
    </div>
  `;

  poolIds.forEach(id=>{
    const card = CH2_CARDS.find(c=>c.id===id);
    document.getElementById("pool").appendChild(makeDragCard(card));
  });
  state.ch2Order.forEach((id,i)=>{
    const card = CH2_CARDS.find(c=>c.id===id);
    const el = makeDragCard(card, i+1);
    document.getElementById("ranked").appendChild(el);
  });

  initDragDropZones(screen, {
    onDrop: (cardId, targetZone, targetIndex)=>{
      // remove from ranked if present
      state.ch2Order = state.ch2Order.filter(id=>id!==cardId);
      if(targetZone === "ranked"){
        const insertAt = targetIndex === null ? state.ch2Order.length : targetIndex;
        state.ch2Order.splice(insertAt,0,cardId);
      }
      resetScoresFromScratch();
      renderCh2(screen);
    }
  });

  document.getElementById("backBtn").addEventListener("click", ()=> goTo(1));
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    if(state.ch2Order.length===CH2_CARDS.length) goTo(3);
  });
}

function makeDragCard(card, rank){
  const el = document.createElement("div");
  el.className = "drag-card sans";
  el.setAttribute("draggable","true");
  el.dataset.cardId = card.id;
  el.tabIndex = 0;
  el.setAttribute("role","button");
  el.setAttribute("aria-label", `${card.label}${rank?`, ranked ${rank}`:", unranked. Press Enter to move to ranked list."}`);
  el.innerHTML = `${rank?`<span class="slot-index">${rank}</span>`:`<span class="grip">⠿</span>`}<span>${card.label}</span>`;

  // keyboard fallback: Enter toggles between pool and end of ranked list
  el.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      const inRanked = state.ch2Order.includes(card.id);
      state.ch2Order = state.ch2Order.filter(id=>id!==card.id);
      if(!inRanked){ state.ch2Order.push(card.id); announce(card.label + " added to your ranked list."); }
      else { announce(card.label + " moved back to available."); }
      resetScoresFromScratch();
      renderCh2(document.getElementById("screen"));
    }
    if(inRankedList(card.id)){
      if(e.key === "ArrowUp"){ e.preventDefault(); moveRanked(card.id,-1); }
      if(e.key === "ArrowDown"){ e.preventDefault(); moveRanked(card.id,1); }
    }
  });

  return el;
}

function inRankedList(id){ return state.ch2Order.includes(id); }
function moveRanked(id, dir){
  const i = state.ch2Order.indexOf(id);
  if(i<0) return;
  const j = clamp(i+dir, 0, state.ch2Order.length-1);
  if(i===j) return;
  state.ch2Order.splice(i,1);
  state.ch2Order.splice(j,0,id);
  resetScoresFromScratch();
  renderCh2(document.getElementById("screen"));
  announce("Moved.");
}

/* Generic drag/drop + touch fallback for the two-zone layout */
function initDragDropZones(screen, {onDrop}){
  const zones = screen.querySelectorAll("[data-zone]");
  let draggedId = null;

  zones.forEach(zone=>{
    zone.addEventListener("dragover", (e)=>{ e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", ()=> zone.classList.remove("over"));
    zone.addEventListener("drop", (e)=>{
      e.preventDefault();
      zone.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain") || draggedId;
      if(!id) return;
      const targetIndex = computeDropIndex(zone, e.clientY);
      onDrop(id, zone.dataset.zone, targetIndex);
    });
  });

  screen.querySelectorAll(".drag-card").forEach(card=>{
    card.addEventListener("dragstart",(e)=>{
      draggedId = card.dataset.cardId;
      e.dataTransfer.setData("text/plain", card.dataset.cardId);
      e.dataTransfer.effectAllowed = "move";
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", ()=> card.classList.remove("dragging"));

    // Touch fallback
    let floatEl = null;
    let startY=0, startX=0;
    card.addEventListener("touchstart", (e)=>{
      const t = e.touches[0];
      startX=t.clientX; startY=t.clientY;
    }, {passive:true});

    card.addEventListener("touchmove", (e)=>{
      const t = e.touches[0];
      if(Math.abs(t.clientY-startY) < 6 && Math.abs(t.clientX-startX) < 6 && !floatEl) return;
      e.preventDefault();
      if(!floatEl){
        floatEl = card.cloneNode(true);
        floatEl.classList.add("ghost-floating");
        const rect = card.getBoundingClientRect();
        floatEl.style.width = rect.width+"px";
        document.body.appendChild(floatEl);
        card.classList.add("dragging");
      }
      floatEl.style.left = (t.clientX - floatEl.offsetWidth/2) + "px";
      floatEl.style.top = (t.clientY - 20) + "px";
      zones.forEach(z=>{
        const r = z.getBoundingClientRect();
        const inside = t.clientX>=r.left && t.clientX<=r.right && t.clientY>=r.top && t.clientY<=r.bottom;
        z.classList.toggle("over", inside);
      });
    }, {passive:false});

    card.addEventListener("touchend", (e)=>{
      card.classList.remove("dragging");
      if(!floatEl) return;
      const t = e.changedTouches[0];
      let targetZone = null, targetIndex = null;
      zones.forEach(z=>{
        const r = z.getBoundingClientRect();
        if(t.clientX>=r.left && t.clientX<=r.right && t.clientY>=r.top && t.clientY<=r.bottom){
          targetZone = z;
          targetIndex = computeDropIndex(z, t.clientY);
        }
        z.classList.remove("over");
      });
      floatEl.remove();
      floatEl = null;
      if(targetZone){
        onDrop(card.dataset.cardId, targetZone.dataset.zone, targetIndex);
      }
    });
  });
}

function computeDropIndex(zone, clientY){
  const cards = [...zone.querySelectorAll(".drag-card")];
  for(let i=0;i<cards.length;i++){
    const r = cards[i].getBoundingClientRect();
    if(clientY < r.top + r.height/2) return i;
  }
  return cards.length;
}

/* =====================================================
   CHAPTER 3 — Timeline sliders
===================================================== */

function renderCh3(screen){
  CH3_SLIDERS.forEach(s=>{
    if(state.ch3Values[s.id] === undefined) state.ch3Values[s.id] = 50;
  });
  const allSet = CH3_SLIDERS.every(s=> state.ch3Values[s.id] !== undefined);

  screen.innerHTML = `
    <span class="eyebrow sans">Chapter 3 · Map your thinking</span>
    <h1 class="display" style="font-size:1.5rem;">Slide each marker to where you tend to land.</h1>
    <p class="lead sans" style="font-size:0.92rem;">Drag with mouse, touch, or select a marker and use arrow keys.</p>

    <div class="timeline-card">
      ${CH3_SLIDERS.map(s=>`
        <div class="timeline-block">
          <p class="timeline-q">${s.question}</p>
          <div class="timeline-track" id="track_${s.id}" data-id="${s.id}">
            <div class="handle"
                 id="handle_${s.id}"
                 tabindex="0"
                 role="slider"
                 aria-valuemin="0" aria-valuemax="100"
                 aria-valuenow="${state.ch3Values[s.id]}"
                 aria-label="${s.question}"
                 style="left:${state.ch3Values[s.id]}%;">↔</div>
          </div>
          <div class="timeline-labels">
            <span>${s.leftLabel}</span>
            <span>${s.rightLabel}</span>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="nav-row">
      <button class="btn ghost sans" id="backBtn">← Previous</button>
      <button class="btn sans" id="nextBtn" ${allSet ? "" : "disabled"}>See my Reflection Journal →</button>
    </div>
  `;

  CH3_SLIDERS.forEach(s=> initSlider(s));

  document.getElementById("backBtn").addEventListener("click", ()=> goTo(2));
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    resetScoresFromScratch();
    goTo(4);
  });
}

function initSlider(s){
  const track = document.getElementById("track_"+s.id);
  const handle = document.getElementById("handle_"+s.id);

  function setValue(v, announceIt){
    v = clamp(Math.round(v),0,100);
    state.ch3Values[s.id] = v;
    handle.style.left = v+"%";
    handle.setAttribute("aria-valuenow", v);
    resetScoresFromScratch();
    if(announceIt) announce(`${s.question} set to ${v}.`);
  }

  function posFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    const pct = ((clientX - rect.left) / rect.width) * 100;
    return clamp(pct,0,100);
  }

  let dragging = false;

  handle.addEventListener("pointerdown",(e)=>{
    dragging = true;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    setValue(posFromClientX(e.clientX), false);
  });
  handle.addEventListener("pointerup",(e)=>{
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
  });

  track.addEventListener("click",(e)=>{
    if(e.target === handle) return;
    setValue(posFromClientX(e.clientX), true);
  });

  handle.addEventListener("keydown",(e)=>{
    const cur = state.ch3Values[s.id];
    if(e.key === "ArrowRight" || e.key==="ArrowUp"){ e.preventDefault(); setValue(cur+5, true); }
    if(e.key === "ArrowLeft" || e.key==="ArrowDown"){ e.preventDefault(); setValue(cur-5, true); }
    if(e.key === "Home"){ e.preventDefault(); setValue(0, true); }
    if(e.key === "End"){ e.preventDefault(); setValue(100, true); }
  });
}

/* =====================================================
   FINAL — Reflection journal
===================================================== */

function renderFinal(screen){
  resetScoresFromScratch();
  const pct = getPercentages();
  const sorted = TRAIT_ORDER.slice().sort((a,b)=> pct[b]-pct[a]);
  const top = sorted[0];
  const second = sorted[1];

  screen.innerHTML = `
    <span class="eyebrow sans">Your reflection journal</span>
    <h1 class="display">A few patterns worth noticing</h1>
    <p class="lead">This isn't a label — it's a snapshot of tendencies based on how you responded today. Patterns shift with context, mood, and time.</p>

    <div class="journal">
      <div class="bars" aria-hidden="false">
        ${sorted.map(k=>`
          <div class="bar-row">
            <div class="bar-label">${TRAITS[k].name}</div>
            <div class="bar-track"><div class="bar-fill" id="bar_${k}" style="width:0%"></div></div>
            <div class="bar-pct">${pct[k]}%</div>
          </div>
        `).join("")}
      </div>

      <div class="insight-block">
        <h4>Your leading pattern: ${TRAITS[top].name}</h4>
        <p>${TRAITS[top].blurb} This showed up most consistently across the scenarios, priorities, and sliders you chose.</p>
      </div>

      <div class="insight-block">
        <h4>A supporting thread: ${TRAITS[second].name}</h4>
        <p>${TRAITS[second].blurb} This suggests it shows up for you in certain situations, even if it isn't your dominant style.</p>
      </div>

      <div class="journal-note">
        <label for="noteBox">Reflection notes — anything you noticed about yourself today?</label>
        <textarea id="noteBox" placeholder="Write freely, this stays only on your screen and is not saved anywhere...">${state.journalNote}</textarea>
      </div>

      <p class="disclaimer">Cognitive Pattern Explorer is an educational, self-reflection tool. It does not diagnose, assess, or treat any mental health condition, and it is not a substitute for guidance from a qualified professional. If something you noticed today feels heavy or persistent, consider talking it through with someone you trust or a licensed professional.</p>
    </div>

    <div class="nav-row">
      <button class="btn ghost sans" id="restartBtn">↺ Start over</button>
      <button class="btn ghost sans" id="backBtn">← Revisit Chapter 3</button>
    </div>
  `;

  document.getElementById("noteBox").addEventListener("input",(e)=>{ state.journalNote = e.target.value; });

  // animate bars in
  requestAnimationFrame(()=>{
    sorted.forEach(k=>{
      const el = document.getElementById("bar_"+k);
      if(el) el.style.width = pct[k] + "%";
    });
  });

  document.getElementById("backBtn").addEventListener("click", ()=> goTo(3));
  document.getElementById("restartBtn").addEventListener("click", ()=>{
    if(confirm("Start over? Your current answers will be cleared.")){
      Object.assign(state, {
        step:0,
        scores: { analytical:0, emotional:0, overthinking:0, action:0, balanced:0 },
        ch1Answers:{}, ch2Order:[], ch3Values:{}, journalNote:""
      });
      ch1Index = 0;
      goTo(0);
    }
  });
}

/* =====================================================
   INIT
===================================================== */

function init(){
  buildAmbient();
  applyModeClass();
  render();
  updateProgress();
  window.addEventListener("resize", debounce(buildAmbient, 400));
}
function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
}

document.addEventListener("DOMContentLoaded", init);
})();
</script>
