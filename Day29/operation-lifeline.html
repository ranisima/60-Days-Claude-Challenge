  .app{

  }

  }

    display:flex; gap:6px; flex-wrap:wrap;
  }
  .step-pill{
    font-size:11px; padding:5px 10px; border-radius:999px;
    background:var(--panel2); border:1px solid var(--border); color:var(--muted);

  .step-pill.active{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0b0e14; font-weight:700; border-color:transparent;}

  .grid-3{grid-template-columns: repeat(auto-fit, minmax(220px,1fr));}
  .grid-4{grid-template-columns: repeat(auto-fit, minmax(180px,1fr));}

    box-shadow: 0 6px 18px rgba(79,140,255,0.25);

  .btn:active{ transform: translateY(0px) scale(0.98); }
  .btn.secondary{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);

  }
  .btn.secondary:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; filter:none; }

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function pickMany(arr, n) {
  const copy = [...arr];
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    const idx = rand(0, copy.length - 1);
    out.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return out;
}
function clamp(v, min = 0, max = 100) { return Math.max(min, Math.min(max, v)); }
function fmtMoney(n) { return "$" + n.toLocaleString() + "M"; }

function generateCompany() {
  const industry = pick(INDUSTRIES);
  const name = `${pick(COMPANY_PREFIXES)} ${pick(COMPANY_SUFFIXES)}`;
  const revenue = rand(80, 4200);
  const factories = rand(2, 14);
  const warehouses = rand(3, 22);
  const suppliers = rand(8, 60);
  const inventoryDays = rand(14, 65);
  const leadTime = rand(7, 45);
  const countries = pickMany(COUNTRIES_POOL, rand(3, 6));
  return { industry, name, revenue, factories, warehouses, suppliers, inventoryDays, leadTime, countries };
}

/* ---------------------------- SMALL COMPONENTS ---------------------------- */

function Bar({ label, value, display, kind }) {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setWidth(clamp(value)), 80);
    return () => clearTimeout(t);
  }, [value]);
  let cls = "";
  if (kind === "good") cls = "good";
  else if (kind === "bad") cls = "bad";
  else if (kind === "warn") cls = "warn";
  return (
    <div>
      <div className="metric-label"><span>{label}</span><span>{display !== undefined ? display : Math.round(value) + "%"}</span></div>
      <div className="bar-track"><div className={"bar-fill " + cls} style={{ width: width + "%" }}></div></div>
    </div>
  );
}

function StepIndicator({ step }) {
  const steps = ["Welcome", "Company", "Crisis", "War Room", "Negotiation", "Boardroom", "AI Strategy", "Results"];

    <div className="stepper">

  );
}

function WarRoom({ actions, onComplete }) {
  const [selected, setSelected] = useState([]);
  const [confirmed, setConfirmed] = useState(false);
  const [metrics, setMetrics] = useState({ cost: 50, inventory: 50, profit: 50, delivery: 50, satisfaction: 50 });

  function toggle(action) {
    if (confirmed) return;
    if (selected.find(a => a.id === action.id)) {
      setSelected(selected.filter(a => a.id !== action.id));
    } else {
      if (selected.length >= 3) return;
      setSelected([...selected, action]);
    }
  }

  function confirm() {
    if (selected.length !== 3) return;
    let m = { cost: 50, inventory: 50, profit: 50, delivery: 50, satisfaction: 50 };
    selected.forEach(a => {
      m.cost = clamp(m.cost + a.effect.cost);
      m.inventory = clamp(m.inventory + a.effect.inventory);
      m.profit = clamp(m.profit + a.effect.profit);
      m.delivery = clamp(m.delivery + a.effect.delivery);
      m.satisfaction = clamp(m.satisfaction + a.effect.satisfaction);
    });
    setMetrics(m);
    setConfirmed(true);
  }

  return (
    <div className="fade-in">
      <div className="section-title"><div className="section-num">3</div><h2>War Room</h2></div>
      <p>Choose exactly <b style={{ color: "var(--text)" }}>3 of the 6 (of 8 available)</b> response actions below. Each one trades off different parts of the business — there's no single "correct" combination, only different strategies. Read the "why this matters" note on each before deciding.</p>
      <div className="grid grid-2">
        {actions.map(a => {
          const isSelected = !!selected.find(s => s.id === a.id);
          const disabled = confirmed || (!isSelected && selected.length >= 3);
          return (
            <div key={a.id} className={"choice" + (isSelected ? " selected" : "") + (disabled && !isSelected ? " disabled" : "")} onClick={() => toggle(a)}>
              <div className="choice-title">{a.title} {isSelected && <span className="tag">SELECTED</span>}</div>
              <div className="choice-desc">{a.desc}</div>
              <div className="why-box" style={{ marginTop: "10px" }}><b>Why this matters:</b> {a.why}</div>
            </div>
          );
        })}
      </div>
      {!confirmed && (
        <div className="btn-row">
          <button className="btn" disabled={selected.length !== 3} onClick={confirm}>
            Confirm {selected.length}/3 Selected Actions
          </button>
        </div>
      )}
      {confirmed && (
        <div className="card fade-in" style={{ marginTop: "22px" }}>
          <h3>Simulated Consequences</h3>
          <p>Here's how your three chosen actions reshaped the business in the days following the crisis.</p>
          <Bar label="Cost Impact (higher = better controlled)" value={metrics.cost} kind={metrics.cost >= 50 ? "good" : "bad"} />
          <Bar label="Inventory Health" value={metrics.inventory} kind={metrics.inventory >= 50 ? "good" : "bad"} />
          <Bar label="Profit Margin" value={metrics.profit} kind={metrics.profit >= 50 ? "good" : "bad"} />
          <Bar label="Delivery Speed" value={metrics.delivery} kind={metrics.delivery >= 50 ? "good" : "bad"} />
          <Bar label="Customer Satisfaction" value={metrics.satisfaction} kind={metrics.satisfaction >= 50 ? "good" : "bad"} />
          <div className="btn-row">
            <button className="btn" onClick={() => onComplete({ selected, metrics })}>Continue to Supplier Negotiation</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Negotiation({ onComplete }) {
  const [round, setRound] = useState(0);
  const [scores, setScores] = useState({ trust: 50, price: 50, lead: 50 });
  const [history, setHistory] = useState([]);
  const [picked, setPicked] = useState(null);

  function choose(opt) {
    if (picked) return;
    setPicked(opt);
  }

  function nextRound() {
    const m = {
      trust: clamp(scores.trust + picked.trust),
      price: clamp(scores.price - picked.price), // lower "price" delta is better for buyer, but keep as score where higher is better i.e invert
      lead: clamp(scores.lead + picked.lead),
    };
    // Recompute properly: price effect from data represents % change to price; we track "price control" score where positive means we resisted/reduced price
    const newScores = {
      trust: clamp(scores.trust + picked.trust),
      price: clamp(scores.price - picked.price),
      lead: clamp(scores.lead + picked.lead),
    };
    setHistory([...history, { round: round, opt: picked }]);
    setScores(newScores);
    setPicked(null);
    if (round + 1 >= NEGOTIATION_ROUNDS.length) {
      const negotiationScore = Math.round((newScores.trust + newScores.price + newScores.lead) / 3);
      onComplete({ scores: newScores, negotiationScore, history: [...history, { round, opt: picked }] });
    } else {
      setRound(round + 1);
    }
  }

  const r = NEGOTIATION_ROUNDS[round];

  return (
    <div className="fade-in">
      <div className="section-title"><div className="section-num">4</div><h2>Supplier Negotiation — Round {round + 1} of {NEGOTIATION_ROUNDS.length}</h2></div>
      <p>You're now negotiating directly with your key supplier to stabilize terms. Each round is a separate decision point — your choices compound across all four rounds.</p>
      <div className="card">
        <h3 style={{ marginBottom: "16px" }}>{r.prompt}</h3>
        {r.options.map((opt, i) => (
          <div
            key={i}
            className={"choice" + (picked === opt ? " selected" : "") + (picked && picked !== opt ? " disabled" : "")}
            onClick={() => choose(opt)}
          >
            <div className="choice-title">{opt.label}</div>
            {picked === opt && <div className="why-box"><b>Why this matters:</b> {opt.why}</div>}
          </div>
        ))}
        <div className="grid grid-3" style={{ marginTop: "18px" }}>
          <Bar label="Trust" value={scores.trust} kind={scores.trust >= 50 ? "good" : "bad"} />
          <Bar label="Price Control" value={scores.price} kind={scores.price >= 50 ? "good" : "bad"} />
          <Bar label="Lead Time Improvement" value={scores.lead} kind={scores.lead >= 50 ? "good" : "bad"} />
        </div>
        <div className="btn-row">
          <button className="btn" disabled={!picked} onClick={nextRound}>
            {round + 1 >= NEGOTIATION_ROUNDS.length ? "Finish Negotiation" : "Next Round"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Boardroom({ onComplete }) {
  const [qIndex, setQIndex] = useState(0);
  const [total, setTotal] = useState(0);
  const [picked, setPicked] = useState(null);
  const [log, setLog] = useState([]);

  const q = CEO_QUESTIONS[qIndex];

  function choose(opt) {
    if (picked) return;
    setPicked(opt);
  }

  function next() {
    const newTotal = total + picked.score;
    const newLog = [...log, { q: q.q, opt: picked }];
    setLog(newLog);
    if (qIndex + 1 >= CEO_QUESTIONS.length) {
      const leadershipScore = Math.round((newTotal / (CEO_QUESTIONS.length * 10)) * 100);
      onComplete({ leadershipScore, log: newLog });
    } else {
      setTotal(newTotal);
      setQIndex(qIndex + 1);
      setPicked(null);
    }
  }

  return (
    <div className="fade-in">
      <div className="section-title"><div className="section-num">5</div><h2>CEO Boardroom — Question {qIndex + 1} of {CEO_QUESTIONS.length}</h2></div>
      <p>As Chief Supply Chain Officer, you now face the board. These questions test leadership judgment beyond the operational fixes you've already made.</p>
      <div className="card">
        <h3 style={{ marginBottom: "16px" }}>{q.q}</h3>
        {q.options.map((opt, i) => (
          <div
            key={i}
            className={"choice" + (picked === opt ? " selected" : "") + (picked && picked !== opt ? " disabled" : "")}
            onClick={() => choose(opt)}
          >
            <div className="choice-title">{opt.label}</div>
            {picked === opt && <div className="why-box"><b>Why this matters:</b> {opt.why}</div>}
          </div>
        ))}
        <div className="btn-row">
          <button className="btn" disabled={!picked} onClick={next}>
            {qIndex + 1 >= CEO_QUESTIONS.length ? "Finish Boardroom" : "Next Question"}
          </button>
        </div>
      </div>
    </div>
  );
}

function FinalDashboard({ state, onReplay }) {
  const { company, crisis, warRoom, negotiation, boardroom, ai } = state;

  // Compute composite scores 0-100
  const resilience = Math.round((warRoom.metrics.inventory + warRoom.metrics.delivery) / 2);
  const costControl = Math.round((warRoom.metrics.cost + warRoom.metrics.profit) / 2);
  const customerSat = Math.round(warRoom.metrics.satisfaction);
  const negotiationScore = negotiation.negotiationScore;
  const leadership = boardroom.leadershipScore;
  const riskMgmt = clamp(Math.round((resilience * 0.4) + (ai.selected.some(a => a.id === "riskmonitor") ? 20 : 0) + (ai.selected.some(a => a.id === "forecasting") ? 10 : 0) + (negotiationScore * 0.3)));

  const overall = Math.round((resilience + costControl + customerSat + negotiationScore + leadership + riskMgmt) / 6);

  // Determine biggest mistake / best decision heuristically
  const warRoomSorted = [...warRoom.selected].sort((a, b) => {
    const sumA = a.effect.cost + a.effect.inventory + a.effect.profit + a.effect.delivery + a.effect.satisfaction;
    const sumB = b.effect.cost + b.effect.inventory + b.effect.profit + b.effect.delivery + b.effect.satisfaction;
    return sumB - sumA;
  });
  const bestWarRoom = warRoomSorted[0];
  const worstWarRoom = warRoomSorted[warRoomSorted.length - 1];

  const boardroomSorted = [...boardroom.log].sort((a, b) => a.opt.score - b.opt.score);
  const worstBoardDecision = boardroomSorted[0];
  const bestBoardDecision = boardroomSorted[boardroomSorted.length - 1];

  let bestDecision, biggestMistake;
  if (bestBoardDecision.opt.score >= 9) {
    biggestMistake = worstBoardDecision.opt.score <= 4
      ? `In the boardroom, choosing "${worstBoardDecision.opt.label}" was a weaker leadership call — it prioritized a short-term optics or budget concern over long-term stability.`
      : `Selecting "${worstWarRoom.title}" in the War Room came at a high relative cost compared to the value it delivered.`;
    bestDecision = `Your boardroom answer "${bestBoardDecision.opt.label}" showed strong executive judgment under pressure.`;
  } else {
    biggestMistake = `Selecting "${worstWarRoom.title}" in the War Room delivered the weakest overall trade-off among your three chosen actions.`;
    bestDecision = `Choosing "${bestWarRoom.title}" in the War Room delivered the strongest overall trade-off among your response actions.`;
  }

  let feedback;
  if (overall >= 85) {
    feedback = "Outstanding crisis leadership. You balanced cost, customer experience, and long-term resilience like a seasoned Chief Supply Chain Officer.";
  } else if (overall >= 65) {
    feedback = "Solid performance. You navigated the crisis reasonably well, though a few trade-offs cost you more than necessary.";
  } else if (overall >= 45) {
    feedback = "A mixed outcome. The company survived the crisis, but several decisions created avoidable strain on cost, trust, or customers.";
  } else {
    feedback = "This crisis exposed real gaps in your response. The company weathered it, but at a significant cost to trust, cash, or customers.";
  }

  let recommendation;
  if (riskMgmt < 55) {
    recommendation = "Invest further in supplier risk monitoring and diversify your supplier base geographically — this crisis likely won't be the last.";
  } else if (negotiationScore < 55) {
    recommendation = "Build negotiation playbooks in advance of the next renewal cycle so your team isn't improvising trust and price trade-offs under pressure.";
  } else if (customerSat < 55) {
    recommendation = "Formalize a customer communication protocol for disruptions — proactive transparency is a low-cost way to protect satisfaction.";
  } else {
    recommendation = "Codify what worked this cycle into a standard crisis playbook so the next disruption response is faster and more consistent.";
  }

  const lessons = [
    "Safety stock and buffer inventory are only useful if you're willing to actually use them under pressure.",
    "Supplier trust built during calm times pays dividends when you need flexibility during a crisis.",
    "Transparent communication with customers is one of the cheapest ways to protect satisfaction during a disruption.",
    "AI-driven visibility (forecasting and risk monitoring) reduces how often you're forced into expensive, reactive decisions.",
  ];

  return (
    <div className="fade-in">
      <div className="section-title"><div className="section-num">7</div><h2>Final Crisis Dashboard</h2></div>
      <div className="card score-hero">
        <div className="score-ring" style={{ "--pct": overall }}>
          <span>{overall}</span>
        </div>
        <h3>Overall Crisis Score</h3>
        <p>Based on your War Room decisions, negotiation outcome, boardroom leadership, and AI strategy.</p>
      </div>

      <div className="grid grid-3" style={{ marginTop: "18px" }}>
        <div className="card">
          <Bar label="Leadership" value={leadership} kind={leadership >= 50 ? "good" : "bad"} />
          <Bar label="Negotiation" value={negotiationScore} kind={negotiationScore >= 50 ? "good" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Resilience" value={resilience} kind={resilience >= 50 ? "good" : "bad"} />
          <Bar label="Cost Control" value={costControl} kind={costControl >= 50 ? "good" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Risk Management" value={riskMgmt} kind={riskMgmt >= 50 ? "good" : "bad"} />
          <Bar label="Customer Satisfaction" value={customerSat} kind={customerSat >= 50 ? "good" : "bad"} />
        </div>
      </div>

      <div className="grid grid-2" style={{ marginTop: "18px" }}>
        <div className="card">
          <h3>📋 Personalized Feedback</h3>
          <p>{feedback}</p>
        </div>
        <div className="card">
          <h3>💡 Expert Recommendation</h3>
          <p>{recommendation}</p>
        </div>
        <div className="card">
          <h3>❌ Biggest Mistake</h3>
          <p>{biggestMistake}</p>
        </div>
        <div className="card">
          <h3>✅ Best Decision</h3>
          <p>{bestDecision}</p>
        </div>
      </div>

      <div className="card" style={{ marginTop: "18px" }}>
        <h3>📚 Lessons Learned</h3>
        {lessons.map((l, i) => (
          <div key={i} className="kv"><span>{i + 1}.</span><span style={{ fontWeight: 400, color: "var(--text)", textAlign: "right", maxWidth: "80%" }}>{l}</span></div>
        ))}
      </div>

      <div className="card" style={{ marginTop: "18px" }}>
        <h3>🏢 Crisis Recap</h3>
        <div className="kv"><span>Company</span><span>{company.name} ({company.industry.name})</span></div>
        <div className="kv"><span>Crisis Faced</span><span>{crisis.icon} {crisis.title}</span></div>
        <div className="kv"><span>War Room Actions</span><span style={{ textAlign: "right" }}>{warRoom.selected.map(a => a.title).join(", ")}</span></div>
        <div className="kv"><span>AI Investments</span><span style={{ textAlign: "right" }}>{ai.selected.map(a => a.title).join(", ")}</span></div>
      </div>

      <div className="btn-row">
        <button className="btn" onClick={onReplay}>🔁 Replay Simulation</button>
      </div>
      <div className="footer-note">Operation Lifeline is a fictional training simulation. All companies, crises, and outcomes are randomly generated.</div>
    </div>
  );
}

function App() {
  const [step, setStep] = useState(0);
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warRoomActions, setWarRoomActions] = useState([]);
  const [warRoomResult, setWarRoomResult] = useState(null);
  const [negotiationResult, setNegotiationResult] = useState(null);
  const [boardroomResult, setBoardroomResult] = useState(null);
  const [aiResult, setAiResult] = useState(null);

  function startSimulation() {
    const c = generateCompany();
    const cr = pick(CRISES);
    const actions = pickMany(WAR_ROOM_ACTIONS, 6);
    setCompany(c);
    setCrisis(cr);
    setWarRoomActions(actions);
    setStep(1);
  }

  function replay() {
    setStep(0);
    setCompany(null);
    setCrisis(null);
    setWarRoomActions([]);
    setWarRoomResult(null);
    setNegotiationResult(null);
    setBoardroomResult(null);
    setAiResult(null);
  }

  return (
    <div className="app">
      {step > 0 && <TopBar step={step} />}
      {step === 0 && <Welcome onStart={startSimulation} />}
      {step === 1 && <CompanyReveal company={company} onNext={() => setStep(2)} />}
      {step === 2 && <CrisisReveal crisis={crisis} company={company} onNext={() => setStep(3)} />}
      {step === 3 && (
        <WarRoom
          actions={warRoomActions}
          onComplete={(res) => { setWarRoomResult(res); setStep(4); }}
        />
      )}
      {step === 4 && (
        <Negotiation onComplete={(res) => { setNegotiationResult(res); setStep(5); }} />
      )}
      {step === 5 && (
        <Boardroom onComplete={(res) => { setBoardroomResult(res); setStep(6); }} />
      )}
      {step === 6 && (
        <AIStrategy onComplete={(res) => { setAiResult(res); setStep(7); }} />
      )}
      {step === 7 && (
        <FinalDashboard
          state={{
            company,
            crisis,
            warRoom: warRoomResult,
            negotiation: negotiationResult,
            boardroom: boardroomResult,
            ai: aiResult,
          }}
          onReplay={replay}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
