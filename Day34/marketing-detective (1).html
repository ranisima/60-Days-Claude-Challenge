<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
:root{
  --orange:#DA7756;
  --orange-glow:rgba(218,119,86,0.55);
  --orange-dim:rgba(218,119,86,0.15);
  --bg-0:#141210;
  --bg-1:#1b1815;
  --bg-2:#221e1a;
  --cork:#2b2118;
  --paper:#efe6d3;
  --paper-2:#e6dcc4;
  --ink:#2a2118;
  --ink-soft:#4a3f33;
  --gold:#d9b26a;
  --green:#7fae7f;
  --red:#c26a5a;
  --border-soft:rgba(255,255,255,0.08);
  --shadow-deep:0 20px 60px rgba(0,0,0,0.6);
  --font-head:'Georgia','Times New Roman',serif;
  --font-body:'Trebuchet MS','Segoe UI',sans-serif;
  --font-type:'Courier New',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(218,119,86,0.06), transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(218,119,86,0.05), transparent 60%),
    var(--bg-0);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
/* subtle noise / grain overlay */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:9999;
  opacity:0.05;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.4) 0px, transparent 1px, transparent 2px, rgba(255,255,255,0.4) 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.15) 0px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-1);}
::-webkit-scrollbar-thumb{background:var(--orange);border-radius:6px;}

#app{position:relative;z-index:1;min-height:100vh;}

.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px 80px;
  animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}

h1,h2,h3{font-family:var(--font-head);margin:0;}
.glow-text{
  color:var(--orange);
  text-shadow:0 0 18px var(--orange-glow);
}

/* ---------- TOP BADGE / HEADER ---------- */
.brand-row{
  display:flex; align-items:center; gap:14px; margin-bottom:6px;
}
.badge-icon{
  width:54px;height:54px;border-radius:50%;
  border:2px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  box-shadow:0 0 20px var(--orange-glow), inset 0 0 12px rgba(218,119,86,0.25);
  background:radial-gradient(circle at 35% 30%, #3a2c22, #1c1712);
}
.brand-title{font-size:2.4rem;letter-spacing:2px;}
.brand-sub{color:var(--gold);font-family:var(--font-type);letter-spacing:3px;font-size:0.8rem;text-transform:uppercase;opacity:0.8;}

/* ---------- BUTTONS ---------- */
.btn{
  font-family:var(--font-head);
  font-size:1rem;
  letter-spacing:1px;
  padding:14px 30px;
  border-radius:6px;
  border:1px solid var(--orange);
  background:linear-gradient(180deg, rgba(218,119,86,0.18), rgba(218,119,86,0.05));
  color:var(--paper);
  cursor:pointer;
  transition:all 0.25s ease;
  position:relative;
  overflow:hidden;
}
.btn:hover{
  background:linear-gradient(180deg, var(--orange), #b85f42);
  color:#1c130d;
  box-shadow:0 0 25px var(--orange-glow);
  transform:translateY(-2px);
}
.btn:active{transform:translateY(0);}
.btn.secondary{
  border-color:var(--border-soft);
  background:rgba(255,255,255,0.03);
}
.btn.secondary:hover{
  border-color:var(--orange);
  background:rgba(218,119,86,0.12);
  color:var(--paper);
  box-shadow:0 0 15px rgba(218,119,86,0.25);
}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:26px;}

/* ================= WELCOME ================= */
.welcome-card{
  max-width:640px;
  text-align:center;
  margin-top:8vh;
}
.case-file-icon{
  width:120px;height:120px;margin:30px auto;
  position:relative;
}
.folder-shape{
  width:120px;height:90px;
  background:linear-gradient(160deg,#3d2e21,#2a2018);
  border:1px solid var(--orange);
  border-radius:4px;
  position:relative;
  box-shadow:0 0 30px var(--orange-glow);
  animation:float 3.5s ease-in-out infinite;
}
.folder-shape::before{
  content:"";
  position:absolute;top:-14px;left:8px;
  width:50px;height:16px;
  background:linear-gradient(160deg,#3d2e21,#2a2018);
  border:1px solid var(--orange);
  border-bottom:none;
  border-radius:4px 4px 0 0;
}
.folder-shape::after{
  content:"?";
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);
  font-size:2.4rem;color:var(--orange);
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.welcome-text{color:var(--paper-2);line-height:1.7;font-size:1.05rem;margin-top:20px;}

/* Theme picker (reused pattern) */
.theme-note{font-family:var(--font-type);color:var(--gold);font-size:0.85rem;margin-top:10px;opacity:0.8;}

/* ================= CASE ASSIGNMENT ================= */
.dossier{
  max-width:720px;
  width:100%;
  background:
    linear-gradient(180deg, var(--paper), var(--paper-2));
  color:var(--ink);
  border-radius:3px;
  padding:38px 42px;
  box-shadow:var(--shadow-deep), inset 0 0 60px rgba(0,0,0,0.06);
  position:relative;
  margin-top:20px;
  transform:rotate(-0.4deg);
  border:1px solid rgba(0,0,0,0.15);
}
.dossier::before{
  content:"CLASSIFIED";
  position:absolute;top:20px;right:-40px;
  transform:rotate(35deg);
  color:rgba(194,106,90,0.55);
  font-family:var(--font-head);
  font-weight:bold;
  font-size:1.4rem;
  letter-spacing:4px;
  border:3px solid rgba(194,106,90,0.55);
  padding:4px 18px;
}
.dossier h2{font-size:1.8rem;color:var(--ink);border-bottom:2px solid var(--ink-soft);padding-bottom:10px;margin-bottom:16px;}
.dossier .stamp{
  font-family:var(--font-type);
  color:var(--red);
  font-size:0.85rem;
  letter-spacing:2px;
  margin-bottom:20px;
}
.dossier-row{display:flex;gap:10px;margin:10px 0;font-size:0.98rem;line-height:1.6;}
.dossier-row b{min-width:150px;color:var(--ink-soft);font-family:var(--font-type);font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;}
.typewriter-line{
  border-right:2px solid var(--ink);
  white-space:nowrap;
  overflow:hidden;
  animation:typing 1.8s steps(40,end);
}
@keyframes typing{from{width:0;}to{width:100%;}}

/* ================= INVESTIGATION BOARD (corkboard) ================= */
.corkboard-wrap{
  width:100%;
  max-width:1200px;
}
.board-header{
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;
  margin-bottom:18px;
  width:100%;
  max-width:1200px;
}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-track{
  width:220px;height:10px;border-radius:6px;background:rgba(255,255,255,0.08);
  overflow:hidden;border:1px solid var(--border-soft);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--orange),var(--gold));
  box-shadow:0 0 10px var(--orange-glow);
  transition:width 0.5s ease;
  border-radius:6px;
}
.progress-label{font-family:var(--font-type);font-size:0.8rem;color:var(--gold);}

.corkboard{
  width:100%;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,0.03), transparent 40%),
    var(--cork);
  background-image:
    radial-gradient(rgba(0,0,0,0.25) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:6px 6px, 9px 9px;
  border:14px solid #1a140e;
  border-radius:8px;
  box-shadow:var(--shadow-deep), inset 0 0 80px rgba(0,0,0,0.45);
  padding:34px;
  position:relative;
  min-height:560px;
}
.corkboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:26px;
}
.string-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}

.evidence-card{
  position:relative;
  z-index:2;
  cursor:grab;
  user-select:none;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.evidence-card:active{cursor:grabbing;}
.evidence-card.dragging{z-index:50;}
.evidence-card:hover{transform:translateY(-4px) scale(1.02);}

.pin{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff9a7a, var(--orange) 60%, #8a3f28);
  box-shadow:0 3px 6px rgba(0,0,0,0.5), 0 0 8px var(--orange-glow);
  z-index:3;
}
.sticky{
  background:linear-gradient(160deg,#fff6d8,#f3e6ab);
  color:#2a2118;
  padding:18px 16px 16px;
  min-height:150px;
  box-shadow:0 8px 18px rgba(0,0,0,0.45);
  font-family:var(--font-body);
  font-size:0.9rem;
  line-height:1.5;
  transform:rotate(var(--tilt,-1deg));
  border-radius:2px;
}
.evidence-card:nth-child(2n) .sticky{--tilt:1.2deg;background:linear-gradient(160deg,#dff2d8,#c9e6c0);}
.evidence-card:nth-child(3n) .sticky{--tilt:-1.6deg;background:linear-gradient(160deg,#f8dcd2,#efc3b4);}
.evidence-card:nth-child(4n) .sticky{--tilt:0.6deg;background:linear-gradient(160deg,#dcebf5,#c1d8ea);}

.sticky h4{
  font-family:var(--font-head);
  font-size:1rem;
  margin-bottom:8px;
  color:var(--ink);
  border-bottom:1px dashed rgba(0,0,0,0.25);
  padding-bottom:6px;
}
.sticky-note-body{white-space:pre-wrap;}
.evidence-tag{
  display:inline-block;font-family:var(--font-type);font-size:0.65rem;
  letter-spacing:1px;text-transform:uppercase;
  background:rgba(0,0,0,0.08);padding:2px 8px;border-radius:10px;margin-bottom:6px;color:var(--ink-soft);
}

.folder-card{
  background:linear-gradient(160deg,#caa66b,#a9824b);
  color:#2a1e10;
  padding:16px;
  min-height:150px;
  border-radius:3px;
  box-shadow:0 8px 18px rgba(0,0,0,0.5);
  position:relative;
}
.folder-card::before{
  content:"";position:absolute;top:-10px;left:14px;width:60px;height:12px;
  background:linear-gradient(160deg,#caa66b,#a9824b);border-radius:3px 3px 0 0;
}
.folder-card h4{font-family:var(--font-head);margin-bottom:8px;font-size:1rem;}
.metric-line{display:flex;justify-content:space-between;font-family:var(--font-type);font-size:0.78rem;padding:3px 0;border-bottom:1px dotted rgba(0,0,0,0.2);}

.polaroid{
  background:#f4f1ea;padding:10px 10px 26px;box-shadow:0 8px 18px rgba(0,0,0,0.5);
  min-height:150px;color:#2a2118;border-radius:2px;position:relative;
}
.polaroid .cap{font-family:var(--font-type);font-size:0.75rem;text-align:center;margin-top:8px;color:#5a4c3a;}
.social-bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;}
.social-bar-label{width:70px;font-family:var(--font-type);font-size:0.68rem;color:#5a4c3a;}
.social-bar-track{flex:1;height:8px;background:rgba(0,0,0,0.1);border-radius:4px;overflow:hidden;}
.social-bar-fill{height:100%;background:linear-gradient(90deg,#c26a5a,#DA7756);border-radius:4px;transition:width 1s ease;}

.magnifier-hint{
  position:absolute;bottom:8px;right:10px;font-size:0.7rem;color:rgba(0,0,0,0.35);font-family:var(--font-type);
}

.hint-banner{
  margin-top:22px;padding:14px 20px;border:1px dashed var(--orange);
  border-radius:6px;background:rgba(218,119,86,0.06);
  font-family:var(--font-type);font-size:0.85rem;color:var(--gold);
  max-width:1200px;width:100%;text-align:center;
}

/* ================= SOLVE MODAL ================= */
.solve-panel{
  max-width:760px;width:100%;
  background:linear-gradient(180deg,#1f1a15,#171310);
  border:1px solid var(--orange);
  border-radius:10px;
  padding:34px;
  box-shadow:var(--shadow-deep), 0 0 40px var(--orange-glow);
  margin-top:20px;
}
.solve-panel h2{color:var(--orange);margin-bottom:6px;}
.solve-sub{color:var(--paper-2);opacity:0.8;font-size:0.9rem;margin-bottom:22px;}
.option-list{display:flex;flex-direction:column;gap:12px;}
.option-item{
  padding:16px 18px;
  border:1px solid var(--border-soft);
  border-radius:8px;
  background:rgba(255,255,255,0.02);
  cursor:pointer;
  transition:all 0.2s ease;
  display:flex;gap:14px;align-items:flex-start;
}
.option-item:hover{
  border-color:var(--orange);
  background:rgba(218,119,86,0.08);
  transform:translateX(4px);
}
.option-item.selected{
  border-color:var(--orange);
  background:rgba(218,119,86,0.14);
  box-shadow:0 0 16px var(--orange-glow);
}
.option-letter{
  width:30px;height:30px;border-radius:50%;
  border:1px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);color:var(--orange);flex-shrink:0;
}
.option-item.correct-flash{
  border-color:var(--green);background:rgba(127,174,127,0.15);
  animation:pulseGreen 0.6s ease;
}
.option-item.wrong-flash{
  border-color:var(--red);background:rgba(194,106,90,0.15);
  animation:shake 0.4s ease;
}
@keyframes pulseGreen{0%{box-shadow:0 0 0 rgba(127,174,127,0.6);}50%{box-shadow:0 0 24px rgba(127,174,127,0.6);}100%{box-shadow:none;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.feedback-box{
  margin-top:18px;padding:14px 18px;border-radius:8px;font-size:0.92rem;line-height:1.6;
  border-left:4px solid var(--orange);background:rgba(218,119,86,0.06);
}

/* ================= CASE CLOSED ================= */
.closed-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:70vh;text-align:center;
}
.stamp-anim{
  font-family:var(--font-head);
  font-size:4rem;
  color:var(--red);
  border:8px solid var(--red);
  padding:10px 34px;
  border-radius:10px;
  transform:rotate(-8deg) scale(2.4);
  opacity:0;
  letter-spacing:6px;
  animation:stampIn 0.5s ease-out 0.15s forwards;
  box-shadow:0 0 40px rgba(194,106,90,0.5);
}
@keyframes stampIn{
  0%{opacity:0;transform:rotate(-8deg) scale(2.4);}
  60%{opacity:1;transform:rotate(-8deg) scale(0.92);}
  100%{opacity:1;transform:rotate(-8deg) scale(1);}
}
.closed-sub{margin-top:30px;color:var(--paper-2);font-family:var(--font-type);letter-spacing:1px;}
.confetti-pin{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:0;animation:pinFall linear forwards;}
@keyframes pinFall{
  0%{opacity:1;transform:translateY(-20px) rotate(0deg);}
  100%{opacity:0;transform:translateY(400px) rotate(400deg);}
}

/* ================= LEARNING REPORT ================= */
.report-card{
  max-width:820px;width:100%;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  color:var(--ink);
  border-radius:6px;
  padding:40px 44px;
  box-shadow:var(--shadow-deep);
  margin-top:10px;
}
.report-card h2{border-bottom:3px double var(--ink-soft);padding-bottom:12px;margin-bottom:20px;color:var(--ink);}
.report-section{margin-bottom:22px;}
.report-section h3{font-size:1.05rem;color:var(--red);margin-bottom:8px;font-family:var(--font-head);}
.report-section p, .report-section li{color:var(--ink-soft);line-height:1.7;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip{
  background:rgba(42,33,24,0.08);border:1px solid rgba(42,33,24,0.25);
  border-radius:20px;padding:5px 14px;font-size:0.82rem;font-family:var(--font-type);
}
.metric-chart{display:flex;align-items:flex-end;gap:14px;height:140px;margin-top:14px;padding:10px 0;border-bottom:2px solid var(--ink-soft);}
.metric-bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.metric-bar{
  width:100%;max-width:44px;background:linear-gradient(180deg,var(--orange),#b85f42);
  border-radius:4px 4px 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 10px rgba(218,119,86,0.4);
}
.metric-bar-label{font-size:0.68rem;font-family:var(--font-type);color:var(--ink-soft);text-align:center;}
.metric-bar-val{font-size:0.72rem;font-family:var(--font-type);color:var(--ink);}

.score-ring-wrap{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.score-ring{width:90px;height:90px;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring circle{fill:none;stroke-width:9;}
.score-ring .bg{stroke:rgba(42,33,24,0.15);}
.score-ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset 1.2s ease;}
.score-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:1.3rem;color:var(--ink);}

/* ================= MISC ================= */
.footer-note{
  margin-top:40px;color:rgba(255,255,255,0.25);font-family:var(--font-type);font-size:0.75rem;text-align:center;
}
.case-picker-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.case-count-badge{
  font-family:var(--font-type);color:var(--gold);font-size:0.85rem;letter-spacing:1px;opacity:0.85;
}
a{color:inherit;}

@media (max-width:640px){
  .brand-title{font-size:1.7rem;}
  .dossier{padding:24px;}
  .solve-panel{padding:22px;}
  .report-card{padding:24px;}
  .corkboard{padding:18px;}
}

.locked-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.5);border-radius:8px;opacity:0;pointer-events:none;transition:opacity 0.2s ease;
  font-family:var(--font-type);color:var(--gold);font-size:0.8rem;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================================================================
   MARKETING DETECTIVE — vanilla JS single-file app
   (Implemented in plain HTML/CSS/JS instead of React+Babel for maximum
   standalone-file reliability — no CDN dependency, no transpile step.)
   ====================================================================== */

/* ---------------------------- CASE DATA ---------------------------- */
const CASES = [
{
  company:"LumaBrew Coffee Co.",
  industry:"Food & Beverage",
  objective:"Drive trial of new Cold Brew Nitro line among young professionals",
  audience:"Urban professionals, 24-34, health-conscious, high disposable income",
  channels:["Instagram Ads","Influencer Seeding","Spotify Audio Ads","In-store Sampling"],
  budget:[["Instagram Ads",40],["Influencers",30],["Spotify Audio",15],["In-store",15]],
  metrics:{reach:"1.8M",ctr:"0.42%",engagement:"2.1%",conversions:"3,900",sales:"$61,200"},
  comments:[
    "Saw the ad three times today but I still don't know what the product actually is.",
    "The influencer's post looked exactly like every other iced coffee ad this summer.",
    "Cool video, but where do I even buy this?"
  ],
  social:[["Instagram",72],["TikTok",18],["Facebook",34],["X",21]],
  mistake:"The creative emphasized moody aesthetic visuals over clear product information, so audiences couldn't identify what was being sold or where to buy it.",
  clues:[
    "CTR is far below category benchmark (0.42% vs ~1.1% average) despite huge reach.",
    "Customer comments repeatedly ask 'what is this' and 'where do I buy it' rather than reacting to the product itself.",
    "In-store sampling (the channel with the clearest product context) converted 4x better per dollar than paid social."
  ],
  explanation:"LumaBrew's campaign achieved strong reach but failed on message clarity. Ads leaned entirely on cinematic mood-board visuals with the product logo appearing for under a second, and no on-screen text stated what was being sold or how to purchase it. This 'branding over communicating' mistake is common when creative teams optimize for aesthetic awards rather than direct response fundamentals — resulting in high impressions but low functional CTR and confused customers.",
  improvements:[
    "Add clear on-screen product callouts and a visible CTA ('Try Cold Brew Nitro — link in bio') within the first 3 seconds.",
    "Pair influencer content with a consistent, recognizable product shot rather than only lifestyle footage.",
    "Redirect a portion of paid social budget toward in-store sampling and geo-targeted retail locators, which showed proven conversion efficiency."
  ]
},
{
  company:"NorthPeak Outdoor Gear",
  industry:"Retail / Apparel",

/* ---------------------------- STATE ---------------------------- */
const State = {
  screen:"welcome", // welcome | assignment | board | solve | closed | report
  caseData:null,
  revealedClues:[false,false,false],
  boardOpened:{metrics:false,comments:false,social:false,mistake:false},
  selectedOption:null,
  solvedCorrectly:null,
  optionsShuffled:null,
};

function pickRandomCase(){
  const c = CASES[Math.floor(Math.random()*CASES.length)];
  return c;
}

function buildOptions(correctCase){
  // gather 3 distractor mistakes from other cases
  const others = CASES.filter(c=>c!==correctCase);
  shuffle(others);
  const distractors = others.slice(0,3).map(c=>c.mistake);
  const opts = shuffle([correctCase.mistake, ...distractors]).map((text,i)=>({
    text, correct: text===correctCase.mistake
  }));
  return opts;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ---------------------------- RENDER ROOT ---------------------------- */
const app = document.getElementById('app');

function render(){
  app.innerHTML = "";
  if(State.screen==="welcome") app.appendChild(renderWelcome());
  else if(State.screen==="assignment") app.appendChild(renderAssignment());
  else if(State.screen==="board") app.appendChild(renderBoard());
  else if(State.screen==="solve") app.appendChild(renderSolve());
  else if(State.screen==="closed") app.appendChild(renderClosed());
  else if(State.screen==="report") app.appendChild(renderReport());
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------------------------- HEADER (shared) ---------------------------- */
function brandRow(){
  const row = el('div','brand-row');
  row.innerHTML = `
    <div class="badge-icon">🕵️</div>
    <div>
      <div class="brand-title glow-text">MARKETING DETECTIVE</div>
      <div class="brand-sub">Case Files &middot; Bureau of Campaign Investigations</div>
    </div>`;
  return row;
}

/* ---------------------------- WELCOME ---------------------------- */
function renderWelcome(){
  const s = el('div','screen');
  s.appendChild(brandRow());
  const card = el('div','welcome-card');
  card.innerHTML = `
    <div class="case-file-icon"><div class="folder-shape"></div></div>
    <p class="welcome-text">
      A marketing campaign has gone wrong — and your instincts as a detective are needed.
      Every case hides its failure in the numbers, the comments, and the noise.
      Study the evidence board. Follow the clues. Name the mistake.
      Can you close the case?
    </p>
    <div class="theme-note">THEME LOCKED: CLAUDE ORANGE</div>
  `;
  s.appendChild(card);
  const row = el('div','btn-row');
  const btn = el('button','btn','Begin Investigation');
  btn.onclick = ()=>{
    State.caseData = pickRandomCase();
    State.revealedClues=[false,false,false];
    State.boardOpened={metrics:false,comments:false,social:false,mistake:false};
    State.selectedOption=null;
    State.solvedCorrectly=null;
    State.optionsShuffled=buildOptions(State.caseData);
    State.screen="assignment";
    render();
  };
  row.appendChild(btn);
  s.appendChild(row);
  s.appendChild(el('div','footer-note',`${CASES.length} confidential case files on record`));
  return s;
}

  `;
  s.appendChild(d);
  const row = el('div','btn-row');
  const btn = el('button','btn','Open Investigation Board →');
  btn.onclick = ()=>{ State.screen="board"; render(); };
  row.appendChild(btn);
  const back = el('button','btn secondary','New Case');
  back.onclick = ()=>{ State.screen="welcome"; render(); };
  row.appendChild(back);
  s.appendChild(row);
  return s;
}

/* ---------------------------- BOARD ---------------------------- */
function progressCount(){
  let n = State.revealedClues.filter(Boolean).length;
  n += Object.values(State.boardOpened).filter(Boolean).length;
  return n; // out of 3 clues + 4 opened panels = 7
}

function renderBoard(){
  const c = State.caseData;
  const s = el('div','screen');
  s.appendChild(brandRow());

  const headerWrap = el('div','board-header');
  headerWrap.innerHTML = `<div><h2 style="color:var(--orange);">${c.company} — Investigation Board</h2>
    <div class="case-count-badge">Drag evidence to rearrange &middot; click cards to inspect</div></div>`;
  const pw = el('div','progress-wrap');
  const total = 7;
  const done = progressCount();
  pw.innerHTML = `<div class="progress-track"><div class="progress-fill" style="width:${(done/total)*100}%"></div></div>
    <div class="progress-label">${done}/${total} EXAMINED</div>`;
  headerWrap.appendChild(pw);
  s.appendChild(headerWrap);

  const board = el('div','corkboard');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','string-svg');
  board.appendChild(svg);

  const grid = el('div','corkboard-grid');
  grid.id = "corkGrid";

  // Card 1: Campaign metrics (folder style)
  const metricsCard = makeEvidenceCard('folder-card', `
    <h4>📊 Campaign Metrics</h4>
    <div class="metric-line"><span>Reach</span><span>${c.metrics.reach}</span></div>
    <div class="metric-line"><span>CTR</span><span>${c.metrics.ctr}</span></div>
    <div class="metric-line"><span>Engagement</span><span>${c.metrics.engagement}</span></div>
    <div class="metric-line"><span>Conversions</span><span>${c.metrics.conversions}</span></div>
    <div class="metric-line"><span>Sales</span><span>${c.metrics.sales}</span></div>
  `, ()=>{ State.boardOpened.metrics=true; refreshProgress(); });

  // Card 2: Budget allocation (folder style, mini bars)
  const budgetInner = c.budget.map(([label,pct])=>`
    <div class="social-bar-row" style="color:#2a1e10;">
      <div class="social-bar-label" style="color:#3a2a15;">${label}</div>
      <div class="social-bar-track" style="background:rgba(0,0,0,0.18);"><div class="social-bar-fill" data-w="${pct}" style="width:0;background:linear-gradient(90deg,#7a5322,#DA7756);"></div></div>
      <div style="width:34px;font-family:var(--font-type);font-size:0.7rem;">${pct}%</div>
    </div>`).join("");
  const budgetCard = makeEvidenceCard('folder-card', `
    <h4>💰 Budget Allocation</h4>${budgetInner}
  `, ()=>{ refreshProgress(); });

  // Card 3: Customer comments (sticky notes)
  const commentsCard = makeEvidenceCard('sticky', `
    <span class="evidence-tag">Overheard</span>
    <h4>Customer Comments</h4>
    <div class="sticky-note-body">${c.comments.map(x=>`"${x}"`).join("\n\n")}</div>
  `, ()=>{ State.boardOpened.comments=true; refreshProgress(); });

  // Card 4: Social performance (polaroid)
  const socialInner = c.social.map(([label,val])=>`
    <div class="social-bar-row">
      <div class="social-bar-label">${label}</div>
      <div class="social-bar-track"><div class="social-bar-fill" data-w="${Math.min(100,val)}" style="width:0;"></div></div>
      <div style="width:34px;font-family:var(--font-type);font-size:0.7rem;">${val}${val<=100?'%':'K'}</div>
    </div>`).join("");
  const socialCard = makeEvidenceCard('polaroid', `
    <span class="evidence-tag">Surveillance</span>
    <h4 style="font-family:var(--font-head);margin-bottom:6px;">Social Media Performance</h4>
    ${socialInner}
    <div class="cap">engagement index by platform</div>
  `, ()=>{ State.boardOpened.social=true; refreshProgress(); });

  // Card 5,6,7: Three supporting clue cards (initially blurred/locked, click to reveal)
  const clueCards = c.clues.map((clue,i)=>{
    const revealed = State.revealedClues[i];
    const card = makeEvidenceCard('sticky', `
      <span class="evidence-tag">Clue ${i+1}</span>
      <h4>${revealed?'Supporting Clue':'??? Redacted'}</h4>
      <div class="sticky-note-body">${revealed?clue:'Click to declassify this clue…'}</div>
    `, (cardEl)=>{
      if(!State.revealedClues[i]){
        State.revealedClues[i]=true;
        refreshProgress();
        render(); // re-render board to show text, keep screen
      }
    });
    return card;
  });

  // Primary mistake teaser card
  const mistakeCard = makeEvidenceCard('folder-card', `
    <h4>🗂 Primary Mistake File</h4>
    <p style="font-size:0.85rem;line-height:1.5;">This file is sealed. Solve the case to unseal the primary marketing mistake and full explanation.</p>
  `, ()=>{ State.boardOpened.mistake=true; refreshProgress(); });

  [metricsCard,budgetCard,commentsCard,socialCard,...clueCards,mistakeCard].forEach(cd=>grid.appendChild(cd));
  board.appendChild(grid);
  s.appendChild(board);

  s.appendChild(el('div','hint-banner', State.revealedClues.every(Boolean) ? "All clues declassified. You're ready to solve the case." : "Tip: click the redacted sticky notes to declassify supporting clues."));

  const row = el('div','btn-row');
  const solveBtn = el('button','btn','Solve the Case →');
  solveBtn.disabled = !State.revealedClues.every(Boolean);
  solveBtn.onclick = ()=>{ if(!solveBtn.disabled){ State.screen="solve"; render(); } };
  row.appendChild(solveBtn);
  const back = el('button','btn secondary','Back to Dossier');
  back.onclick=()=>{ State.screen="assignment"; render(); };
  row.appendChild(back);
  s.appendChild(row);

  // animate bar fills after mount
  requestAnimationFrame(()=>{
    document.querySelectorAll('.social-bar-fill').forEach(elBar=>{
      const w = elBar.getAttribute('data-w');
      if(w!==null){ elBar.style.width = w+"%"; }
    });
  });

  enableDrag(grid);

  return s;
}

function refreshProgress(){
  // re-render only progress area if board is current screen; simplest: full render
  if(State.screen==="board") render();
}

let cardCounter=0;
function makeEvidenceCard(innerClass, innerHTML, onClick){
  cardCounter++;
  const wrap = el('div','evidence-card');
  wrap.dataset.id = "ev"+cardCounter;
  const pin = el('div','pin');
  const inner = el('div', innerClass, innerHTML);
  wrap.appendChild(pin);
  wrap.appendChild(inner);
  if(onClick){
    wrap.addEventListener('click',(ev)=>{
      if(wrap._dragged) { wrap._dragged=false; return; }
      onClick(wrap);
    });
  }
  return wrap;
}

/* Simple drag-to-reposition within the grid area using absolute offsets */
function enableDrag(container){
  let activeCard=null, startX=0, startY=0, origX=0, origY=0;
  container.querySelectorAll('.evidence-card').forEach(card=>{
    card.style.position = card.style.position || 'relative';
    card.addEventListener('mousedown', startDrag);
    card.addEventListener('touchstart', startDrag, {passive:true});
  });
  function startDrag(e){
    activeCard = e.currentTarget;
    activeCard.classList.add('dragging');
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX; startY = point.clientY;
    const style = window.getComputedStyle(activeCard);
    origX = parseFloat(activeCard.style.left)||0;
    origY = parseFloat(activeCard.style.top)||0;
    activeCard.style.position='relative';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, {passive:true});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
  }
  function onMove(e){
    if(!activeCard) return;
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const dy = point.clientY - startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4){ activeCard._dragged = true; }
    activeCard.style.left = (origX+dx)+"px";
    activeCard.style.top = (origY+dy)+"px";
  }
  function endDrag(){
    if(activeCard) activeCard.classList.remove('dragging');
    activeCard=null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchend', endDrag);
  }
}

/* ---------------------------- SOLVE ---------------------------- */
function renderSolve(){
  const c = State.caseData;
  const s = el('div','screen');
  s.appendChild(brandRow());
  const panel = el('div','solve-panel');
  panel.innerHTML = `<h2>Name the Primary Marketing Mistake</h2>
    <div class="solve-sub">Based on the evidence board for <b>${c.company}</b>, choose the explanation that best fits the clues.</div>`;
  const list = el('div','option-list');
  const letters = ['A','B','C','D'];
  State.optionsShuffled.forEach((opt,i)=>{
    const item = el('div','option-item');
    item.innerHTML = `<div class="option-letter">${letters[i]}</div><div>${opt.text}</div>`;
    item.onclick = ()=>{
      if(State.solvedCorrectly!==null) return; // locked after answer
      document.querySelectorAll('.option-item').forEach(o=>o.classList.remove('selected'));
      item.classList.add('selected');
      State.selectedOption = opt;
    };
    list.appendChild(item);
  });
  panel.appendChild(list);

  const feedback = el('div');
  panel.appendChild(feedback);

  const row = el('div','btn-row');
  const submitBtn = el('button','btn','Submit Verdict');
  submitBtn.onclick = ()=>{
    if(!State.selectedOption){ return; }
    const items = document.querySelectorAll('.option-item');
    items.forEach((item,i)=>{
      const opt = State.optionsShuffled[i];
      if(opt.correct) item.classList.add(State.selectedOption.correct?'correct-flash':'');
      if(opt===State.selectedOption && !opt.correct) item.classList.add('wrong-flash');
      if(opt===State.selectedOption && opt.correct) item.classList.add('correct-flash');
      if(opt.correct) item.classList.add('correct-flash');
    });
    State.solvedCorrectly = State.selectedOption.correct;
    feedback.innerHTML = `<div class="feedback-box">${State.solvedCorrectly ? '✅ Correct deduction, detective.' : '❌ Not quite — the highlighted option shows the real culprit.'} Proceeding to case closure…</div>`;
    submitBtn.disabled = true;
    setTimeout(()=>{ State.screen="closed"; render(); }, 1600);
  };
  row.appendChild(submitBtn);
  s.appendChild(panel);
  s.appendChild(row);
  return s;
}

/* ---------------------------- CASE CLOSED ---------------------------- */
function renderClosed(){
  const s = el('div','screen closed-wrap');
  const stamp = el('div','stamp-anim', State.solvedCorrectly ? "CASE CLOSED" : "CASE FILED");
  s.appendChild(stamp);
  s.appendChild(el('div','closed-sub', State.solvedCorrectly ? "Verdict confirmed. Evidence matched." : "Verdict logged. Review the full findings below."));
  // falling pins confetti
  for(let i=0;i<24;i++){
    const p = el('div','confetti-pin');
    p.style.left = (Math.random()*100)+"%";
    p.style.top = "-20px";
    p.style.animationDuration = (1.4+Math.random()*1.4)+"s";
    p.style.animationDelay = (Math.random()*0.6)+"s";
    p.style.background = Math.random()>0.5 ? "var(--orange)" : "var(--gold)";
    s.appendChild(p);
  }
  const row = el('div','btn-row');
  const btn = el('button','btn','View Learning Report →');
  btn.onclick = ()=>{ State.screen="report"; render(); };
  row.appendChild(btn);
  s.appendChild(row);
  return s;
}

/* ---------------------------- LEARNING REPORT ---------------------------- */
function parsePercent(str){
  const m = String(str).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}
function renderReport(){
  const c = State.caseData;
  const s = el('div','screen');
  s.appendChild(brandRow());
  const card = el('div','report-card');

  const scorePct = State.solvedCorrectly ? 100 : 55;
  const ringCirc = 2*Math.PI*36;
  card.innerHTML = `
    <h2>Learning Report — ${c.company}</h2>
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg width="90" height="90">
          <circle class="bg" cx="45" cy="45" r="36"></circle>
          <circle class="fg" cx="45" cy="45" r="36" stroke-dasharray="${ringCirc}" stroke-dashoffset="${ringCirc}"></circle>
        </svg>
        <div class="score-ring-num">${scorePct}%</div>
      </div>
      <div>
        <div style="font-family:var(--font-type);color:var(--red);letter-spacing:1px;">DETECTIVE RATING</div>
        <div style="color:var(--ink-soft);margin-top:4px;">${State.solvedCorrectly ? "Sharp deduction — you correctly identified the root cause." : "Good effort — review the correct explanation below to sharpen your instincts."}</div>
      </div>
    </div>

    <div class="report-section">
      <h3>Primary Marketing Mistake</h3>
      <p>${c.mistake}</p>
    </div>

    <div class="report-section">
      <h3>Full Explanation</h3>
      <p>${c.explanation}</p>
    </div>

    <div class="report-section">
      <h3>Supporting Clues</h3>
      <ul>${c.clues.map(cl=>`<li>${cl}</li>`).join("")}</ul>
    </div>

    <div class="report-section">
      <h3>Suggested Improvements</h3>
      <ul>${c.improvements.map(im=>`<li>${im}</li>`).join("")}</ul>
    </div>

    <div class="report-section">
      <h3>Campaign Metrics Recap</h3>
      <div class="metric-chart" id="reportChart"></div>
    </div>

    <div class="report-section">
      <h3>Channels &amp; Budget</h3>
      <div class="chip-row">${c.channels.map(ch=>`<span class="chip">${ch}</span>`).join("")}</div>
    </div>
  `;
  s.appendChild(card);

  const row = el('div','btn-row');
  const again = el('button','btn','Investigate a New Case');
  again.onclick = ()=>{ State.screen="welcome"; render(); };
  row.appendChild(again);
  s.appendChild(row);

  // animate ring + bars after mount
  requestAnimationFrame(()=>{
    const fg = card.querySelector('.score-ring .fg');
    if(fg){ fg.style.strokeDashoffset = (ringCirc - (ringCirc*scorePct/100)); }

    const chart = document.getElementById('reportChart');
    const metricEntries = [
      ["Reach", c.metrics.reach],
      ["CTR", c.metrics.ctr],
      ["Engagement", c.metrics.engagement],
      ["Conversions", c.metrics.conversions],
    ];
    const vals = metricEntries.map(([,v])=>parsePercent(v));
    const maxVal = Math.max(...vals,1);
    metricEntries.forEach(([label,rawVal],i)=>{
      const col = el('div','metric-bar-col');
      const bar = el('div','metric-bar');
      const pctHeight = Math.max(6,(vals[i]/maxVal)*100);
      col.appendChild(bar);
      col.appendChild(el('div','metric-bar-val', String(rawVal)));
      col.appendChild(el('div','metric-bar-label', label));
      chart.appendChild(col);
      requestAnimationFrame(()=>{ bar.style.height = pctHeight+"%"; });
    });
  });

  return s;
}

/* ---------------------------- INIT ---------------------------- */
render();
</script>
