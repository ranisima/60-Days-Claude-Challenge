<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C10;
    --bg-panel: #14161C;
    --bg-panel-alt: #1B1E26;
    --bg-raised: #20232D;
    --border: #2A2E38;
    --border-soft: #22252E;
    --text-primary: #F2F1EC;
    --text-secondary: #9CA3AF;
    --text-muted: #6B7280;
    --accent-amber: #FFB648;
    --accent-amber-dim: #8A6A2E;
    --accent-teal: #3ECF8E;
    --accent-violet: #9B8CFF;
    --accent-red: #FF6B6B;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Inter', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,182,72,0.06), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(155,140,255,0.05), transparent 40%);
    background-attachment: fixed;
  }

  #root{ min-height:100vh; }

  h1,h2,h3,h4{ font-family: var(--font-display); margin:0; letter-spacing:-0.01em; }
  p{ margin:0; line-height:1.6; color: var(--text-secondary); }
  button{ font-family: var(--font-body); cursor:pointer; }

  ::selection{ background: rgba(255,182,72,0.3); }

  /* ---------- Layout ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }

  .rail{
    width: 232px;
    flex-shrink:0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border-soft);
    padding: 28px 0;
    display:flex;
    flex-direction:column;
    gap: 2px;
    position: sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .rail-title{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    padding: 0 22px 16px 22px;
  }
  .rail-item{
    display:flex;
    align-items:center;
    gap: 12px;
    background: none;
    border: none;
    text-align:left;
    color: var(--text-muted);
    padding: 11px 22px;
    border-left: 2px solid transparent;
    transition: all 0.2s ease;
    font-size: 13.5px;
  }
  .rail-item .rail-num{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .rail-item.done{ color: var(--text-secondary); }
  .rail-item.done .rail-num{ color: var(--accent-teal); }
  .rail-item.active{
    color: var(--text-primary);
    border-left-color: var(--accent-amber);
    background: rgba(255,182,72,0.06);
  }
  .rail-item.active .rail-num{ color: var(--accent-amber); }
  .rail-item.locked{ opacity: 0.35; cursor: not-allowed; }
  .rail-item:not(.locked):hover{ color: var(--text-primary); }

  .main{
    flex:1;
    min-width:0;
    padding: 56px 40px 100px;
    display:flex;
    justify-content:center;
  }
  .main-inner{
    width:100%;
    max-width: 860px;
  }

  /* ---------- Step shell ---------- */
  .fade-in{
    animation: fadeSlideIn 0.45s ease both;
  }
  @keyframes fadeSlideIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent-amber);
    margin-bottom: 14px;
  }
  .step-title{
    font-size: 34px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .step-subtitle{
    font-size: 16px;
    max-width: 640px;
    margin-bottom: 34px;
  }

  /* ---------- Grids & cards ---------- */
  .grid{ display:grid; gap:16px; margin-bottom: 30px; }
  .grid.three{ grid-template-columns: repeat(3, 1fr); }
  .grid.two{ grid-template-columns: repeat(2, 1fr); }

  .info-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 22px 20px;
  }
  .info-emoji{ font-size: 26px; margin-bottom: 10px; }
  .info-emoji.big{ font-size: 44px; margin-bottom: 14px; }
  .info-card h3{ font-size: 16px; margin-bottom: 8px; }
  .info-card p{ font-size: 13.5px; }

  .track-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align:left;
    color: var(--text-primary);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: all 0.2s ease;
  }
  .track-card:hover{
    border-color: var(--accent-amber-dim);
    transform: translateY(-3px);
    background: var(--bg-panel-alt);
  }
  .track-card h3{ font-size: 17px; }
  .track-card p{ font-size: 13.5px; flex:1; }
  .track-cta{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-amber);
  }

  /* ---------- Buttons ---------- */
  .primary-btn{
    background: linear-gradient(135deg, var(--accent-amber), #E89A3C);
    color: #1A1200;
    border: none;
    font-weight: 600;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14.5px;
    transition: all 0.2s ease;
  }
  .primary-btn:hover:not(:disabled){ filter: brightness(1.08); transform: translateY(-1px); }
  .primary-btn:disabled{ opacity: 0.35; cursor: not-allowed; }
  .primary-btn.big{ padding: 15px 30px; font-size: 15px; }

  .ghost-btn{
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 13px 22px;
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.2s ease;
  }
  .ghost-btn:hover{ border-color: var(--text-secondary); color: var(--text-primary); }

  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* ---------- Forms ---------- */
  .form-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 28px;
    display:flex;
    flex-direction:column;
    gap: 16px;
    margin-bottom: 30px;
  }
  .form-card.center{ align-items:center; text-align:center; }
  .form-row{ display:flex; flex-direction:column; gap:6px; }
  .form-row span{ font-size: 13px; color: var(--text-secondary); font-weight:500; }
  .form-row input{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text-primary);
    font-size: 14.5px;
    font-family: var(--font-body);
  }
  .form-row input:focus{ outline: none; border-color: var(--accent-amber); }
  .form-row input::placeholder{ color: var(--text-muted); }
  .rolling-text{ font-family: var(--font-mono); color: var(--text-secondary); padding: 30px 0; }
  .muted{ color: var(--text-muted); font-size: 14px; }

  /* ---------- Snapshot ---------- */
  .snapshot-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 6px 24px;
    margin-bottom: 28px;
  }
  .snapshot-row{
    display:flex;
    justify-content:space-between;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .snapshot-row:last-child{ border-bottom:none; }
  .snapshot-label{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    flex-shrink:0;
    width: 140px;
  }
  .snapshot-val{ font-size: 14.5px; text-align:right; color: var(--text-primary); }

  /* ---------- Teach block ---------- */
  .teach-block{
    background: var(--bg-panel-alt);
    border-left: 3px solid var(--accent-violet);
    border-radius: 0 10px 10px 0;
    padding: 18px 22px;
    margin-bottom: 24px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .teach-row .teach-label{
    display:block;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-violet);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .teach-row p{ font-size: 14px; color: var(--text-secondary); }

  /* ---------- Claude card ---------- */
  .claude-card{
    background: var(--bg-panel);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 30px;
  }
  .claude-card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 12px;
  }
  .claude-tag{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent-teal);
  }
  .copy-btn{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .copy-btn:hover{ color: var(--text-primary); border-color: var(--accent-teal); }
  .claude-prompt{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    margin:0;
    line-height:1.6;
  }

  /* ---------- Platforms ---------- */
  .platform-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-align:left;
    color: var(--text-primary);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: all 0.2s ease;
  }
  .platform-card:hover{ border-color: var(--border); background: var(--bg-panel-alt); }
  .platform-card.selected{ border-color: var(--accent-amber); background: rgba(255,182,72,0.05); }
  .platform-head{ display:flex; align-items:center; gap:10px; }
  .platform-emoji{ font-size: 20px; }
  .platform-name{ font-weight:600; font-size: 15px; flex:1; }
  .fit-badge{
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 5px;
    letter-spacing: 0.03em;
  }
  .fit-good{ background: rgba(62,207,142,0.14); color: var(--accent-teal); }
  .fit-mid{ background: rgba(255,182,72,0.14); color: var(--accent-amber); }
  .fit-low{ background: rgba(255,107,107,0.12); color: var(--accent-red); }
  .platform-reason{ font-size: 13px; }
  .select-flag{ font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); }
  .platform-card.selected .select-flag{ color: var(--accent-amber); }

  /* ---------- Pillars ---------- */
  .pillar-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-align:left;
    color: var(--text-primary);
    display:flex;
    flex-direction:column;
    gap:8px;
    transition: all 0.2s ease;
  }
  .pillar-card:hover:not(.disabled){ border-color: var(--border); background: var(--bg-panel-alt); }
  .pillar-card.selected{ border-color: var(--accent-violet); background: rgba(155,140,255,0.06); }
  .pillar-card.disabled{ opacity: 0.4; cursor: not-allowed; }
  .pillar-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pillar-head h3{ font-size: 15px; }
  .goal-badge{
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 5px;
    background: var(--bg-raised);
    color: var(--text-secondary);
    flex-shrink:0;
  }
  .pillar-card p{ font-size: 13px; }
  .pillar-card.selected .select-flag{ color: var(--accent-violet); }
  .counter{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-secondary);
    margin: -14px 0 24px 4px;
  }

  /* ---------- Roadmap ---------- */
  .roadmap{
    display:grid;
    grid-template-columns: repeat(2,1fr);
    gap: 16px;
    margin-bottom: 30px;
  }
  .week-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--accent-teal);
    border-radius: var(--radius);
    padding: 20px;
  }
  .week-num{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-teal);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .week-card h3{ font-size: 17px; margin-bottom: 10px; }
  .week-goal{ font-size: 13.5px; color: var(--text-primary); margin-bottom: 8px; }
  .week-goal strong{ color: var(--accent-teal); }
  .week-strategy{ font-size: 13.5px; }

  /* ---------- Event ---------- */
  .event-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 26px;
    margin-bottom: 30px;
  }
  .event-card h3{ font-size: 20px; margin-bottom: 10px; }
  .event-card > p{ font-size: 14.5px; margin-bottom: 20px; }
  .event-options{ display:flex; flex-direction:column; gap:10px; }
  .event-opt{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    text-align:left;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.2s ease;
  }
  .event-opt:hover{ border-color: var(--accent-amber-dim); }
  .event-opt.selected{ border-color: var(--accent-amber); background: rgba(255,182,72,0.08); }
  .consequence{
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 10px;
    animation: fadeSlideIn 0.35s ease both;
  }
  .consequence.good{ background: rgba(62,207,142,0.08); border: 1px solid rgba(62,207,142,0.3); }
  .consequence.risky{ background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.3); }
  .consequence-tag{
    display:block;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .consequence.good .consequence-tag{ color: var(--accent-teal); }
  .consequence.risky .consequence-tag{ color: var(--accent-red); }
  .consequence p{ font-size: 14px; color: var(--text-primary); }

  /* ---------- Report ---------- */
  .report-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 30px;
  }
  .report-card{
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .report-card.wide{ grid-column: span 2; }
  .report-card h4{
    font-size: 13px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .report-card p{ font-size: 14px; color: var(--text-primary); margin-bottom: 6px; }
  .report-card p strong{ color: var(--text-secondary); font-weight: 600; }
  .report-card ul{ margin:0; padding-left: 18px; display:flex; flex-direction:column; gap:8px; }
  .report-card li{ font-size: 14px; color: var(--text-primary); }
  .report-card.good{ border-color: rgba(62,207,142,0.35); }
  .report-card.good h4{ color: var(--accent-teal); }
  .report-card.bad{ border-color: rgba(255,107,107,0.3); }
  .report-card.bad h4{ color: var(--accent-red); }
  .meter{
    width:100%;
    height: 10px;
    background: var(--bg-raised);
    border-radius: 6px;
    overflow:hidden;
    margin-bottom: 8px;
  }
  .meter-fill{
    height:100%;
    background: linear-gradient(90deg, var(--accent-teal), var(--accent-amber));
    border-radius: 6px;
    transition: width 0.6s ease;
  }
  .meter-label{ font-family: var(--font-mono); font-size: 13px; color: var(--text-primary); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px){
    .grid.three{ grid-template-columns: 1fr; }
    .grid.two{ grid-template-columns: 1fr; }
    .roadmap{ grid-template-columns: 1fr; }
    .report-grid{ grid-template-columns: 1fr; }
    .report-card.wide{ grid-column: span 1; }
  }

  @media (max-width: 780px){
    .app{ flex-direction: column; }
    .rail{
      width:100%;
      height:auto;
      position: sticky;
      top:0;
      z-index: 10;
      flex-direction: row;
      overflow-x:auto;
      padding: 14px 0;
      border-right:none;
      border-bottom: 1px solid var(--border-soft);
    }
    .rail-title{ display:none; }
    .rail-item{
      flex-direction:column;
      gap:4px;
      border-left:none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      white-space:nowrap;
    }
    .rail-item.active{ border-bottom-color: var(--accent-amber); background:none; }
    .rail-label{ font-size: 11px; }
    .main{ padding: 32px 18px 80px; }
    .step-title{ font-size: 26px; }
    .snapshot-row{ flex-direction:column; gap:4px; }
    .snapshot-val{ text-align:left; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ============================= DATA ============================= */

const STAGES = [
  "Welcome",
  "Choose Track",
  "Understand The Brand",
  "Platform Strategy",
  "Content Pillars",
  "30-Day Roadmap",
  "Unexpected Event",
  "Growth Report",
];

function randomChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function randomSample(arr, n) {
  const copy = [...arr];
  const out = [];
  while (out.length < n && copy.length) {
    const i = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(i, 1)[0]);
  }
  return out;
}

const BUSINESS_TEMPLATES = [
  { name: "Brew & Bloom Coffee Co.", industry: "Specialty Coffee Roaster", audience: "Urban professionals, 24-38, who care about ethical sourcing", competitors: "Blue Bottle, local third-wave cafés", emoji: "☕" },
  { name: "Nomad Fit Gear", industry: "Outdoor Fitness Apparel", audience: "Weekend hikers and travel-fitness fans, 22-45", competitors: "Patagonia, Cotopaxi", emoji: "🎒" },
  { name: "Petal & Pine", industry: "Sustainable Home Decor", audience: "Eco-conscious homeowners, 28-50", competitors: "West Elm, independent Etsy sellers", emoji: "🌿" },
  { name: "CodeCrate", industry: "SaaS for Freelance Developers", audience: "Independent developers and small dev teams", competitors: "Notion, Linear", emoji: "💻" },
  { name: "Glow Theory", industry: "Clean Skincare Brand", audience: "Skincare enthusiasts, 18-34, active on social media", competitors: "Glossier, The Ordinary", emoji: "✨" },
  { name: "Paws & Co.", industry: "Pet Wellness Subscription Box", audience: "New pet owners, 25-45, urban and suburban", competitors: "BarkBox, Chewy", emoji: "🐾" },
  { name: "Forkful", industry: "Meal-Prep Delivery Service", audience: "Busy professionals who want healthy food without cooking", competitors: "HelloFresh, local meal preppers", emoji: "🍱" },
  { name: "Ledger Lane", industry: "Bookkeeping Software for Small Business", audience: "Small business owners and solo entrepreneurs", competitors: "QuickBooks, FreshBooks", emoji: "📊" },
  { name: "Wanderlust Studio", industry: "Boutique Travel Planning Agency", audience: "Millennial and Gen Z travelers seeking unique trips", competitors: "Airbnb Experiences, travel bloggers", emoji: "🧳" },
  { name: "Bright Minds Tutoring", industry: "Online Tutoring for Teens", audience: "Parents of middle and high schoolers, 35-50", competitors: "Varsity Tutors, Khan Academy", emoji: "📚" },
];

const BUDGET_POOL = [
  "$500/month — bootstrapped and scrappy",
  "$2,000/month — small but consistent",
  "$10,000/month — funded and growing",
  "$50,000/month — established brand with a team",
];

const CHALLENGE_POOL = [
  "Nobody knows this brand exists yet — awareness is at zero.",
  "Plenty of likes and follows, but almost no sales.",
  "A bigger, louder competitor is drowning out this brand.",
  "Content feels inconsistent — no clear voice or schedule.",
  "One post went viral, but growth stalled right after.",
];

function generateRandomBusiness() {
  const t = randomChoice(BUSINESS_TEMPLATES);
  return {
    mode: "random",
    name: t.name,
    emoji: t.emoji,
    industry: t.industry,
    audience: t.audience,
    competitors: t.competitors,
    budget: randomChoice(BUDGET_POOL),
    challenge: randomChoice(CHALLENGE_POOL),
  };
}

const FIELD_CONFIG = {
  business: [
    { key: "name", label: "Business Name", placeholder: "e.g. Brew & Bloom Coffee Co." },
    { key: "industry", label: "Industry", placeholder: "e.g. Specialty Coffee Roaster" },
    { key: "audience", label: "Target Audience", placeholder: "e.g. Urban professionals, 24-38, who value ethical sourcing" },

function platformFit(brand, platform) {
  const weight = brand.mode === "personal" ? platform.personalWeight : platform.businessWeight;
  if (weight >= 4) return { weight, label: "Strong Fit", tone: "good" };
  if (weight === 3) return { weight, label: "Situational", tone: "mid" };
  return { weight, label: "Lower Priority", tone: "low" };
}

function platformReason(brand, platform) {
  const isPersonal = brand.mode === "personal";
  const who = isPersonal ? "your voice and expertise" : `${brand.name}'s ${brand.industry.toLowerCase()}`;
  const fit = platformFit(brand, platform);
  if (fit.tone === "good") {
    return `${platform.blurb} For ${who}, this is where the right audience already spends time — a strong first choice.`;
  }
  if (fit.tone === "mid") {
    return `${platform.blurb} It can work for ${who}, but only if there's a clear, specific reason to be there — otherwise it's a distraction from stronger channels.`;
  }
  return `${platform.blurb} For ${who}, this is likely a lower priority right now — the effort-to-reward ratio is weaker than other channels.`;
}

function generateRoadmap(brand, pillarTitles) {
  const isPersonal = brand.mode === "personal";
  const p1 = pillarTitles[0], p2 = pillarTitles[1], p3 = pillarTitles[2];
  if (isPersonal) {
    return [
      { week: "Week 1", title: "Define Your Point of View", goal: "Clarify what you want to be known for.", strategy: "Write a one-line positioning statement, optimize your bio and profile photo on every chosen platform, and audit old posts that don't match your niche." },
      { week: "Week 2", title: "Show Up Consistently", goal: `Publish your first wave of "${p1}" content.`, strategy: "Post on a fixed, sustainable schedule. Consistency matters more than volume — a small, reliable cadence beats sporadic bursts." },
      { week: "Week 3", title: "Build Real Relationships", goal: `Layer in "${p2}" content and start engaging.`, strategy: "Reply to every comment, DM people who engage, and start conversations with a few peers in your niche." },
      { week: "Week 4", title: "Expand Your Reach", goal: `Introduce "${p3}" content and review what worked.`, strategy: "Try one collaboration or guest appearance, check which posts performed best, and plan month two around the pattern." },
    ];
  }
  return [
    { week: "Week 1", title: "Foundation", goal: "Get the basics right before publishing at volume.", strategy: `Audit and optimize profiles on chosen platforms, define a consistent brand voice, and study ${brand.competitors} for gaps to fill.` },
    { week: "Week 2", title: "Awareness", goal: `Publish the first wave of "${p1}" content.`, strategy: "Focus on reach — post consistently and track which formats get the most views and shares." },
    { week: "Week 3", title: "Engagement & Trust", goal: `Layer in "${p2}" content.`, strategy: "Reply to every comment and DM, and start conversations instead of only broadcasting." },
    { week: "Week 4", title: "Conversion", goal: `Introduce "${p3}" content with soft calls-to-action.`, strategy: "Add clear next steps to posts, review the month's performance, and carry forward what worked into month two." },
  ];
}

function AskClaudeCard({ prompt }) {

  return (
    <div className="claude-card">
      <div className="claude-card-head">

        <button className="copy-btn" onClick={copy}>{copied ? "Copied ✓" : "Copy Prompt"}</button>

  );
}

function PillarStep({ brand, selected, setSelected, onNext }) {
  const pool = brand.mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS;
  const isPersonal = brand.mode === "personal";
  function toggle(id) {
    setSelected((s) => {
      if (s.includes(id)) return s.filter((x) => x !== id);
      if (s.length >= 3) return s;
      return [...s, id];
    });
  }
  const claudePrompt = isPersonal
    ? `I'm building a personal brand as ${brand.name} around ${brand.industry}. Give me 3 content pillars that balance authority-building with connection, and explain what goal each one supports.`
    : `For ${brand.name}, help me choose 3 content pillars that balance awareness, trust, and conversion. Explain what goal each pillar supports.`;

  return (
    <StepShell
      eyebrow="STAGE 04 · CONTENT STRATEGY"
      title="Pick exactly 3 content pillars"
      subtitle="Content pillars are recurring themes, not individual posts. Each one should serve a different goal — pick a mix, not three versions of the same thing."
    >
      <div className="grid two">
        {pool.map((p) => {
          const isSel = selected.includes(p.id);
          const disabled = !isSel && selected.length >= 3;
          return (
            <button
              key={p.id}
              className={"pillar-card" + (isSel ? " selected" : "") + (disabled ? " disabled" : "")}
              onClick={() => toggle(p.id)}
              disabled={disabled}
            >
              <div className="pillar-head">
                <h3>{p.title}</h3>
                <span className="goal-badge">{p.goal}</span>
              </div>
              <p>{p.desc}</p>
              <span className="select-flag">{isSel ? "✓ Selected" : disabled ? "Limit reached" : "Tap to select"}</span>
            </button>
          );
        })}
      </div>
      <div className="counter">{selected.length} / 3 selected</div>

      <TeachBlock
        what="A content pillar is a recurring topic bucket — like 'Behind the Scenes' or 'Audience Education' — that every individual post can fall under."
        why="Pillars keep content consistent and purposeful. Without them, a content calendar turns into random ideas with no clear goal, which makes it impossible to tell what's actually working."
      />

      <AskClaudeCard prompt={claudePrompt} />

      <button className="primary-btn big" disabled={selected.length !== 3} onClick={onNext}>
        Build The 30-Day Roadmap →
      </button>
    </StepShell>
  );
}

function RoadmapStep({ brand, pillarTitles, onNext }) {
  const roadmap = useMemo(() => generateRoadmap(brand, pillarTitles), [brand, pillarTitles]);
  const isPersonal = brand.mode === "personal";
  const claudePrompt = isPersonal
    ? `Build a 4-week content roadmap for my personal brand as ${brand.name} in ${brand.industry}. Week 1 should focus on defining my point of view and optimizing my bio. Describe weekly goals and strategy, not individual posts.`
    : `Build a 4-week content roadmap for ${brand.name}. Describe weekly goals and strategy — not individual posts — moving from foundation to awareness to trust to conversion.`;

  return (
    <StepShell
      eyebrow="STAGE 05 · THE ROADMAP"
      title="A 30-day plan, week by week"
      subtitle="A roadmap sets weekly goals and strategy — it's deliberately not a list of individual posts. Strategy first, content calendar second."
    >
      <div className="roadmap">
        {roadmap.map((w) => (
          <div className="week-card" key={w.week}>
            <div className="week-num">{w.week}</div>
            <h3>{w.title}</h3>
            <p className="week-goal"><strong>Goal:</strong> {w.goal}</p>
            <p className="week-strategy">{w.strategy}</p>
          </div>
        ))}
      </div>

      <TeachBlock
        what="A content roadmap sequences strategy over time — what to focus on first, second, third — rather than listing every post in advance."
        why="Posting randomly from day one wastes the early weeks, when trust and profile basics matter most. Sequencing goals (foundation → awareness → trust → conversion) means every week builds on the last."
      />

      <AskClaudeCard prompt={claudePrompt} />

      <button className="primary-btn big" onClick={onNext}>See What Happens Next →</button>
    </StepShell>
  );
}

function EventStep({ brand, event, choiceIndex, setChoiceIndex, onNext }) {
  const isPersonal = brand.mode === "personal";
  const claudePrompt = isPersonal
    ? `Something unexpected just happened to my personal brand (${brand.name}, ${brand.industry}): ${event.title}. How should I respond, and what should I watch out for?`
    : `Something unexpected just happened at ${brand.name}: ${event.title}. As a marketing strategist, how should we respond, and what should we watch out for?`;

  return (
    <StepShell
      eyebrow="STAGE 06 · THE CURVEBALL"
      title="An unexpected event just happened"
      subtitle="Real strategy isn't just planning — it's reacting well when something you didn't plan for shows up."
    >
      <div className="event-card">
        <h3>{event.title}</h3>
        <p>{event.desc}</p>
        <div className="event-options">
          {event.options.map((opt, i) => (
            <button
              key={i}
              className={"event-opt" + (choiceIndex === i ? " selected" : "")}
              onClick={() => setChoiceIndex(i)}
            >
              {opt.label}
            </button>
          ))}
        </div>
        {choiceIndex !== null && (
          <div className={"consequence" + (event.options[choiceIndex].good ? " good" : " risky")}>
            <span className="consequence-tag">{event.options[choiceIndex].good ? "Solid response" : "Worth reconsidering"}</span>
            <p>{event.options[choiceIndex].consequence}</p>
          </div>
        )}
      </div>

      <TeachBlock
        what="Marketing curveballs are moments a brand didn't plan for — a viral hit, a copycat, a public disagreement — that still need a fast, strategic response."
        why="Strategy isn't just the plan you make in advance. How a brand reacts under unplanned pressure often shapes public perception more than any scheduled post."
      />

      <AskClaudeCard prompt={claudePrompt} />

      <button className="primary-btn big" disabled={choiceIndex === null} onClick={onNext}>
        See The Growth Report →
      </button>
    </StepShell>
  );
}

function GrowthReport({ brand, platformIds, pillarTitles, event, choiceIndex, onRestart }) {
  const isPersonal = brand.mode === "personal";
  const L = LABELS[brand.mode] || LABELS.random;

  const platformObjs = PLATFORMS.filter((p) => platformIds.includes(p.id));
  const avgWeight = platformObjs.length
    ? platformObjs.reduce((sum, p) => sum + (isPersonal ? p.personalWeight : p.businessWeight), 0) / platformObjs.length
    : 0;
  const platformPct = Math.round((avgWeight / 5) * 100);

  const pillarGoals = new Set((brand.mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS)
    .filter((p) => pillarTitles.includes(p.title))
    .map((p) => p.goal));
  const pillarPct = pillarGoals.size >= 3 ? 95 : pillarGoals.size === 2 ? 85 : 65;

  const eventGood = event.options[choiceIndex].good;
  const eventPct = eventGood ? 92 : 55;

  const growthPotential = Math.round((platformPct + pillarPct + eventPct) / 3);

  const scored = [
    { key: "platform", label: "Platform choices", pct: platformPct, good: `Prioritizing ${platformObjs.map((p) => p.name).join(", ")} matches where this audience actually spends attention.`, bad: `A couple of the chosen platforms are a lower priority fit — time there may outweigh the return right now.` },
    { key: "pillar", label: "Content pillar mix", pct: pillarPct, good: `Choosing pillars across ${pillarGoals.size} different goals (${[...pillarGoals].join(", ")}) keeps content balanced instead of repetitive.`, bad: `The three pillars lean toward similar goals — worth swapping one for a different objective next round.` },
    { key: "event", label: "Curveball response", pct: eventPct, good: `Choosing "${event.options[choiceIndex].label}" was the stronger read of the moment.`, bad: `"${event.options[choiceIndex].label}" is a common instinct, but it likely cost more momentum than it protected.` },
  ].sort((a, b) => b.pct - a.pct);

  const best = scored[0];
  const worst = scored[scored.length - 1];

  const lessonPoolPersonal = [
    "Authenticity compounds — audiences can tell within seconds when a post doesn't sound like the real person behind it.",
    "Consistency beats intensity — a modest, reliable schedule outperforms sporadic bursts of high effort.",
    "Niche clarity attracts the right people faster than trying to appeal to everyone.",
    "Engagement is a two-way habit — replying to comments and DMs builds the relationship that content alone can't.",
    "Your story is a strategic asset, not just personal detail — specific experiences are what make content memorable.",
  ];
  const lessonPoolBusiness = [
    "Strategy comes before content — every post should trace back to a specific audience and goal.",
    "Fewer, better-fit platforms beat being everywhere at once.",
    "A content pillar without a clear goal is just a topic, not a strategy.",
    "How a brand responds to the unexpected shapes trust more than any planned campaign.",
    "Owned channels like email matter more, not less, when budgets shrink.",
  ];
  const lessons = randomSample(isPersonal ? lessonPoolPersonal : lessonPoolBusiness, 3);

  const claudePrompt = isPersonal
    ? `Review my personal brand strategy as ${brand.name} in ${brand.industry}. My platforms: ${platformObjs.map((p) => p.name).join(", ")}. My content pillars: ${pillarTitles.join(", ")}. What's the single biggest gap in this plan?`
    : `Review the marketing strategy for ${brand.name}. Platforms: ${platformObjs.map((p) => p.name).join(", ")}. Content pillars: ${pillarTitles.join(", ")}. What's the single biggest gap in this plan?`;

  return (
    <StepShell
      eyebrow="STAGE 07 · CLOSING THE CASE"
      title="Growth Report"
      subtitle={`Here's how the strategy for ${brand.name} came together.`}
    >
      <div className="report-grid">
        <div className="report-card wide">
          <h4>Audience Understanding</h4>
          <p><strong>{isPersonal ? "You" : brand.name}:</strong> {brand.industry}</p>
          <p><strong>Audience:</strong> {brand.audience}</p>
          <p><strong>{L.competitors}:</strong> {brand.competitors}</p>
        </div>
        <div className="report-card">
          <h4>Platform Strategy</h4>
          <p>{platformObjs.map((p) => p.emoji + " " + p.name).join("  ·  ") || "None selected"}</p>
        </div>
        <div className="report-card">
          <h4>Content Strategy</h4>
          <p>{pillarTitles.join("  ·  ")}</p>
        </div>
        <div className="report-card">
          <h4>Growth Potential</h4>
          <div className="meter"><div className="meter-fill" style={{ width: growthPotential + "%" }} /></div>
          <p className="meter-label">{growthPotential}/100</p>
        </div>
        <div className="report-card good">
          <h4>✓ Best Decision</h4>
          <p>{best.good}</p>
        </div>
        <div className="report-card bad">
          <h4>⚠ Biggest Mistake To Watch</h4>
          <p>{worst.bad}</p>
        </div>
        <div className="report-card wide">
          <h4>Three Marketing Lessons</h4>
          <ul>
            {lessons.map((l) => <li key={l}>{l}</li>)}
          </ul>
        </div>
      </div>

      <AskClaudeCard prompt={claudePrompt} />

      <button className="primary-btn big" onClick={onRestart}>🔁 Take On A New Case</button>
    </StepShell>
  );
}

/* ============================= APP ROOT ============================= */

function App() {
  const [step, setStep] = useState(0);
  const [maxReached, setMaxReached] = useState(0);
  const [mode, setMode] = useState(null);
  const [brand, setBrand] = useState(null);
  const [platformIds, setPlatformIds] = useState([]);
  const [pillarIds, setPillarIds] = useState([]);
  const [event, setEvent] = useState(null);
  const [choiceIndex, setChoiceIndex] = useState(null);

  function goto(n) {
    setStep(n);
    setMaxReached((m) => Math.max(m, n));
  }

  function restart() {
    setStep(0);
    setMaxReached(0);
    setMode(null);
    setBrand(null);
    setPlatformIds([]);
    setPillarIds([]);
    setEvent(null);
    setChoiceIndex(null);
  }

  function handleBrandReady(b) {
    setBrand(b);
    goto(2);
  }

  function handlePick(id) {
    setMode(id);
    goto(1.5);
  }

  const pillarPool = brand && brand.mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS;
  const pillarTitles = pillarIds.map((id) => (pillarPool.find((p) => p.id === id) || {}).title).filter(Boolean);

  let content;
  if (step === 0) {
    content = <Welcome onStart={() => goto(1)} />;
  } else if (step === 1) {
    content = <TrackSelect onPick={handlePick} />;
  } else if (step === 1.5) {
    content = mode === "random"
      ? <RandomReveal onReady={handleBrandReady} />
      : <BrandForm mode={mode} onSubmit={handleBrandReady} />;
  } else if (step === 2) {
    content = <BrandSnapshot brand={brand} onNext={() => goto(3)} />;
  } else if (step === 3) {
    content = <PlatformStep brand={brand} selected={platformIds} setSelected={setPlatformIds} onNext={() => goto(4)} />;
  } else if (step === 4) {
    content = <PillarStep brand={brand} selected={pillarIds} setSelected={setPillarIds} onNext={() => goto(5)} />;
  } else if (step === 5) {
    content = <RoadmapStep brand={brand} pillarTitles={pillarTitles} onNext={() => {
      const pool = brand.mode === "personal" ? EVENTS_PERSONAL : EVENTS_BUSINESS;
      setEvent(randomChoice(pool));
      setChoiceIndex(null);
      goto(6);
    }} />;
  } else if (step === 6) {
    content = <EventStep brand={brand} event={event} choiceIndex={choiceIndex} setChoiceIndex={setChoiceIndex} onNext={() => goto(7)} />;
  } else if (step === 7) {
    content = (
      <GrowthReport
        brand={brand}
        platformIds={platformIds}
        pillarTitles={pillarTitles}
        event={event}
        choiceIndex={choiceIndex}
        onRestart={restart}
      />
    );
  }

  const railStep = step === 1.5 ? 1 : Math.floor(step);

  return (
    <div className="app">
      <ProgressRail step={railStep} maxReached={Math.floor(maxReached)} onJump={(i) => setStep(i)} />
      <main className="main">
        <div className="main-inner">{content}</div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
