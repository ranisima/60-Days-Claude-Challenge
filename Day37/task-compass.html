<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass</title>
<style>
:root{
  --bg-0:#0a0e17;
  --bg-1:#0f1524;
  --panel:#131b2ccc;
  --panel-solid:#131b2c;
  --line:#26314a;
  --ink:#e7ecf7;
  --ink-dim:#8b96b3;
  --teal:#4fd1c5;
  --amber:#f5a623;
  --rose:#ff6b81;
  --fe:#5b9dff;
  --be:#9d7bff;
  --qa:#3ddc97;
  --pm:#ffb454;
  --ux:#ff7bd0;
  --cs:#4fd1c5;
  --em:#ff6b6b;
  --radius:18px;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, #14203a 0%, transparent 45%),
    radial-gradient(circle at 85% 0%, #1a1430 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, #0e2430 0%, transparent 50%),
    var(--bg-0);
  background-attachment:fixed;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:42px 42px;
  opacity:.06;
  pointer-events:none;
  z-index:0;
}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- HEADER / COMPASS ---------- */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
.compass{
  width:64px;height:64px;border-radius:50%;
  border:2px solid var(--line);
  position:relative;flex:none;
  background:radial-gradient(circle, #16203590 0%, #0a0e1790 70%);
  display:flex;align-items:center;justify-content:center;
}
.compass-needle{
  position:absolute;width:2px;height:24px;
  background:linear-gradient(var(--teal), transparent);
  top:8px;left:calc(50% - 1px);
  transform-origin:bottom center;
  transition:transform .8s cubic-bezier(.4,1.6,.4,1);
  border-radius:2px;
}
.compass-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);}
.hero h1{
  font-size:30px;margin:0;letter-spacing:-.02em;font-weight:800;
  background:linear-gradient(120deg,#fff,var(--teal) 60%,var(--fe));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:4px 0 0;color:var(--ink-dim);font-size:14.5px;}

.progress-track{
  display:flex;gap:8px;margin:0 0 26px;
}
.progress-seg{
  flex:1;height:6px;border-radius:4px;background:#1b2438;overflow:hidden;position:relative;
}
.progress-seg > i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg, var(--teal), var(--fe));
  transition:width .5s ease;
}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);margin:-18px 0 26px;text-transform:uppercase;letter-spacing:.08em;}
.progress-labels span.active{color:var(--teal);}

/* ---------- PANEL / CARD SHELLS ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 50px -20px #000a;
  animation:rise .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.ticket{
  border:1px solid var(--line);
  border-left:4px solid var(--teal);
  border-radius:12px;
  padding:16px 18px;
  background:linear-gradient(135deg,#171f33,#121a2b);
  margin-bottom:20px;
}
.ticket-id{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:.06em;}
.ticket-text{font-size:17px;font-weight:600;margin-top:6px;line-height:1.4;}
.ticket-tag{
  display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 9px;border-radius:20px;background:#ffffff12;color:var(--ink-dim);margin-top:10px;
}

h2.stage-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);margin:0 0 4px;font-weight:700;}
h3.q-count{font-size:12px;color:var(--ink-dim);margin:0 0 18px;font-weight:500;}

/* ---------- ROLE CARDS ---------- */
.role-pool{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 8px;}
.role-card{
  --c:var(--teal);
  user-select:none;cursor:grab;
  display:flex;align-items:center;gap:9px;
  padding:11px 15px;border-radius:13px;
  background:#151d30;
  border:1px solid var(--line);
  border-bottom:3px solid var(--c);
  font-size:13.5px;font-weight:600;
  transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
}
.role-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px -10px var(--c);}
.role-card:active{cursor:grabbing;}
.role-card.dragging{opacity:.35;}
.role-card.used{opacity:.3;pointer-events:none;filter:grayscale(.6);}
.role-emoji{font-size:16px;}

/* ---------- DROPZONES (stage 1) ---------- */
.slot{
  min-height:64px;border:2px dashed var(--line);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);font-size:13px;margin:14px 0;
  transition:all .2s ease;background:#0e1524a0;
}
.slot.over{border-color:var(--teal);background:#4fd1c51a;box-shadow:0 0 0 3px #4fd1c522;}
.slot.filled{border-style:solid;padding:6px;}
.slot .role-card{margin:0;width:100%;justify-content:center;animation:snap .35s cubic-bezier(.3,1.6,.4,1);}
@keyframes snap{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---------- STAGE 2 sequence ---------- */
.seq-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0;}
.seq-slot{
  min-width:120px;min-height:56px;flex:1;
  border:2px dashed var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;padding:8px;
  color:var(--ink-dim);font-size:12px;text-align:center;background:#0e1524a0;transition:all .2s ease;position:relative;
}
.seq-slot .step-num{position:absolute;top:-9px;left:8px;background:var(--bg-1);color:var(--teal);font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:6px;border:1px solid var(--line);}
.seq-slot.over{border-color:var(--teal);background:#4fd1c51a;}
.seq-slot.filled{border-style:solid;}
.seq-arrow{color:var(--line);font-size:20px;}

/* ---------- STAGE 3 chips ---------- */
.chip-grid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.chip{
  --c:var(--teal);
  padding:10px 16px;border-radius:30px;border:1.5px solid var(--line);
  background:#151d30;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:all .18s ease;
}
.chip:hover{transform:translateY(-2px);}
.chip.selected{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, #151d30);box-shadow:0 6px 18px -8px var(--c);}
.chip-count{font-size:11.5px;color:var(--ink-dim);margin:6px 0 0;}

/* ---------- BUTTONS ---------- */
.btn{
  appearance:none;border:none;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:14px;
  padding:13px 26px;border-radius:12px;
  background:linear-gradient(120deg,var(--teal),var(--fe));
  color:#06121a;letter-spacing:.01em;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  margin-top:18px;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px -10px var(--teal);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;}

/* ---------- FEEDBACK PANEL ---------- */
.feedback{
  margin-top:22px;padding:20px;border-radius:14px;
  background:#0e1524;border:1px solid var(--line);
  animation:rise .45s ease;
}
.feedback h4{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px;}
.feedback p{margin:0 0 12px;line-height:1.55;font-size:14.5px;color:#dfe5f4;}
.assist-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.assist-pill{font-size:12px;padding:5px 11px;border-radius:20px;background:#ffffff10;border:1px solid var(--line);color:var(--ink-dim);}

.flow-anim{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0;}
.flow-node{
  padding:9px 14px;border-radius:10px;background:#151d30;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;opacity:0;transform:translateX(-14px);
  animation:flowin .5s ease forwards;
}
@keyframes flowin{to{opacity:1;transform:translateX(0);}}
.flow-arrow{color:var(--teal);font-size:16px;opacity:0;animation:flowin .5s ease forwards;}

/* ---------- INTRO SELECT SCREEN reused as workplace confirm ---------- */
.tag-note{font-size:12.5px;color:var(--ink-dim);background:#ffffff08;border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:20px;}

/* ---------- RESULTS ---------- */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0;}
@media(max-width:560px){.score-grid{grid-template-columns:1fr;}}
.score-card{background:#0e1524;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.score-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:8px;display:flex;justify-content:space-between;}
.bar-track{height:9px;background:#1b2438;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;width:0%;transition:width 1s cubic-bezier(.2,.9,.2,1);background:linear-gradient(90deg,var(--teal),var(--fe));}

.reflection-block{margin-top:10px;padding:16px 18px;border-radius:12px;background:#0e1524;border:1px solid var(--line);margin-bottom:12px;}
.reflection-block h4{margin:0 0 6px;font-size:13px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;}
.reflection-block p{margin:0;font-size:14px;line-height:1.55;color:#dfe5f4;}

.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
.confetti{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2;}}

.workplace-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);
  background:#4fd1c51a;border:1px solid #4fd1c540;padding:5px 12px;border-radius:20px;margin-bottom:14px;font-weight:600;
}
footer.note{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:40px;}

@media (max-width:600px){
  .hero h1{font-size:24px;}
  .panel{padding:18px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= DATA ============================= */
const ROLES = [
  {id:'fe', name:'Frontend Developer', emoji:'🖥️', color:'var(--fe)'},
  {id:'be', name:'Backend Developer', emoji:'🗄️', color:'var(--be)'},
  {id:'qa', name:'QA Engineer', emoji:'🧪', color:'var(--qa)'},
  {id:'pm', name:'Product Manager', emoji:'🧭', color:'var(--pm)'},
  {id:'ux', name:'UX Designer', emoji:'🎨', color:'var(--ux)'},
  {id:'cs', name:'Customer Support', emoji:'💬', color:'var(--cs)'},
  {id:'em', name:'Engineering Manager', emoji:'🧩', color:'var(--em)'},
  {id:'sec', name:'Security Engineer', emoji:'🔒', color:'#7effc4'},
];
const R = Object.fromEntries(ROLES.map(r=>[r.id,r]));

const STAGE1_TASKS = [
 {id:'T-101', text:'A customer reports that payments fail only on iPhones.', tag:'Bug Report', owner:'fe',
   why:'This is a platform-specific rendering or JS behavior issue, which almost always traces back to how the checkout UI handles input on iOS Safari.',
   assist:['qa','be','cs']},
 {id:'T-102', text:'The API response time for the search endpoint has doubled this week.', tag:'Performance', owner:'be',
   why:'Search endpoint latency is a server-side and database concern, so the person who owns that service is best placed to diagnose and fix it.',
   assist:['em','qa']},
 {id:'T-103', text:'Users are confused about where to find the "export data" button.', tag:'Usability', owner:'ux',
   why:'This is about discoverability and layout, a design problem rather than a technical one — the fix is likely a redesign of that flow.',
   assist:['pm','fe']},
 {id:'T-104', text:'A competitor just launched a feature customers keep asking us for.', tag:'Strategy', owner:'pm',
   why:'Deciding whether and how to respond to competitive pressure is a prioritization and roadmap decision, which sits with product leadership.',
   assist:['ux','em']},
 {id:'T-105', text:'The nightly build has been failing for three days straight.', tag:'Build Health', owner:'be',
   why:'Build failures usually originate from code or dependency changes going into the backend/service layer that owns the pipeline.',
   assist:['qa','em']},
 {id:'T-106', text:'A user found a way to view another account\'s private data by editing the URL.', tag:'Security', owner:'sec',
   why:'This is an access-control vulnerability, so it needs to be triaged and closed by whoever owns application security, even though engineering will implement the fix.',
   assist:['be','em']},
 {id:'T-107', text:'A customer is angry that their refund request has gone unanswered for a week.', tag:'Support Escalation', owner:'cs',
   why:'An unanswered request is first and foremost a support relationship problem — someone needs to own communicating with that customer right away.',
   assist:['pm']},
 {id:'T-108', text:'QA found that a new feature technically works but feels clunky to use.', tag:'Product Feedback', owner:'ux',
   why:'"Works but feels clunky" is a design quality judgment, not a functional bug, so it belongs with whoever shapes the interaction.',
   assist:['pm','fe']},
 {id:'T-109', text:'The team keeps missing sprint deadlines and nobody knows why.', tag:'Team Health', owner:'em',
   why:'Repeated missed deadlines point to a process or capacity issue, which is the engineering manager\'s job to diagnose and address.',
   assist:['pm']},
 {id:'T-110', text:'A customer asks if the product can integrate with a tool they use daily.', tag:'Feature Request', owner:'pm',
   why:'Whether to build a new integration is a scoping and prioritization call that starts with product, even though it may involve everyone downstream.',
   assist:['be','ux']},
];

const STAGE2_TASKS = [
 {id:'R-201', text:'A user reports the app crashes when uploading large files.', tag:'Bug', tag2:'workflow',
   steps:['cs','qa','be','fe'],
   explain:'Support hears it first and reproduces the report, QA confirms and isolates it, backend investigates the upload service, and frontend adjusts the client-side handling before it ships back to the user.'},
 {id:'R-202', text:'Marketing wants a new signup page live before Friday\'s campaign.', tag:'Feature Delivery', tag2:'workflow',
   steps:['pm','ux','fe','qa'],
   explain:'Product scopes the requirement, design shapes the page, frontend builds it, and QA verifies it before the campaign goes live — a tight but complete chain.'},
 {id:'R-203', text:'A security researcher privately reports a vulnerability in the login flow.', tag:'Security', tag2:'workflow',
   steps:['sec','be','qa','em'],
   explain:'Security triages and confirms severity first, backend implements the fix, QA verifies it under pressure, and the engineering manager signs off before it\'s considered resolved.'},
 {id:'R-204', text:'Customers are requesting a dark mode option for the app.', tag:'Feature Request', tag2:'workflow',
   steps:['pm','ux','fe'],
   explain:'This smaller feature only needs three steps: product decides it\'s worth doing, design defines the look, and frontend implements it.'},
 {id:'R-205', text:'A backend outage caused checkout to fail for twenty minutes.', tag:'Incident', tag2:'workflow',
   steps:['be','em','cs','pm'],
   explain:'Backend fixes the outage in real time, the engineering manager coordinates the incident response, support communicates with affected customers, and product decides on any follow-up (credits, comms, etc).'},
 {id:'R-206', text:'QA finds a rendering bug only on older Android devices.', tag:'Bug', tag2:'workflow',
   steps:['qa','fe','qa'],
   explain:'QA files the detailed report, frontend fixes the device-specific rendering issue, and QA verifies the fix closes the loop before release.'},
];

const STAGE3_TASKS = [
 {id:'C-301', text:'Customer satisfaction scores suddenly dropped this month.', tag:'Org-wide',
   primary:'pm', support:['cs','ux','qa'],
   why:'Product needs to own investigating and coordinating the response, but the actual signal will come from support tickets, usability friction, and quality issues — so all three need to be in the conversation.',
   flow:'Customer Support surfaces patterns → Product Manager investigates and prioritizes → UX and QA dig into root causes → findings loop back to Product for a plan.'},
 {id:'C-302', text:'Sales increased dramatically after a surprise viral mention.', tag:'Org-wide',
   primary:'em', support:['be','pm','sec'],
   why:'Sudden scale is first an infrastructure and stability problem, so engineering leadership coordinates capacity while product decides how to capitalize on the moment and security checks nothing breaks under load.',
   flow:'Engineering Manager coordinates capacity response → Backend scales infrastructure → Security monitors for abuse → Product Manager plans how to capture the opportunity.'},
 {id:'C-303', text:'Negative reviews are appearing online about a recent update.', tag:'Org-wide',
   primary:'pm', support:['ux','qa','cs'],
   why:'Product needs to own the response and decide what changes, but understanding *why* people are unhappy requires design, quality, and support all contributing their view of the problem.',
   flow:'Customer Support collects specifics from reviews → QA checks for real defects → UX evaluates usability complaints → Product Manager synthesizes and decides on next steps.'},
 {id:'C-304', text:'A major feature is going to be delayed by several weeks.', tag:'Org-wide',
   primary:'em', support:['pm','fe','be'],
   why:'The engineering manager owns understanding why the delay happened and what it will take to recover, while product manages expectations and the development roles report real status.',
   flow:'Engineering Manager assesses the real timeline → Frontend and Backend report specific blockers → Product Manager decides what to communicate externally and adjusts scope if needed.'},
];

/* ============================= STATE ============================= */
let state = {
  screen:'intro',
  workplace:null,
  stage:1,
  s1idx:0, s2idx:0, s3idx:0,
  s1pool:[], s2pool:[], s3pool:[],
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  s1answered:false, s2answered:false, s3answered:false,
  s1current:null, s2current:null, s3current:null, s2filled:[], s3selected:[],
  overAssignCount:0, underCollabCount:0,
};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick3(arr){return shuffle(arr).slice(0,3);}

/* ============================= RENDER ROOT ============================= */
const app = document.getElementById('app');
function render(){
  if(state.screen==='intro') renderIntro();
  else if(state.screen==='stage1') renderStage1();
  else if(state.screen==='stage2') renderStage2();
  else if(state.screen==='stage3') renderStage3();
  else if(state.screen==='results') renderResults();
}

/* progress bar helper */
function progressHTML(){
  const stageOf = {intro:0, stage1:1, stage2:2, stage3:3, results:4}[state.screen];
  let segs='';
  for(let i=1;i<=3;i++){
    const pct = i<stageOf ? 100 : (i===stageOf ? currentStagePct() : 0);
    segs += `<div class="progress-seg"><i style="width:${pct}%"></i></div>`;
  }
  const labels = ['Who Owns This?','Task Routing','Collaboration'];
  let lab = '<div class="progress-labels">';
  labels.forEach((l,i)=>{ lab += `<span class="${i+1===stageOf?'active':''}">${l}</span>`; });
  lab += '</div>';
  return `<div class="progress-track">${segs}</div>${lab}`;
}
function currentStagePct(){
  if(state.screen==='stage1') return (state.s1idx/3)*100;
  if(state.screen==='stage2') return (state.s2idx/3)*100;
  if(state.screen==='stage3') return (state.s3idx/3)*100;
  return 0;
}

function headerHTML(sub){
  const needleRot = {intro:-40, stage1:-10, stage2:40, stage3:90, results:180}[state.screen] || 0;
  return `
  <div class="hero">
    <div class="compass"><div class="compass-needle" style="transform:rotate(${needleRot}deg)"></div><div class="compass-dot" style="position:absolute"></div></div>
    <div>
      <h1>Task Compass</h1>
      <p>${sub || 'Learn how work flows through real organizations.'}</p>
    </div>
  </div>`;
}

/* ============================= INTRO ============================= */
function renderIntro(){
  app.innerHTML = `
    ${headerHTML()}
    <div class="panel">
      <div class="workplace-badge">🏢 Tech Company simulation</div>
      <h2 class="stage-title">Before we start</h2>
      <p style="color:#dfe5f4;line-height:1.6;font-size:15px;">
        You're stepping into a growing tech company. Work is going to land on your desk — bugs, feature
        requests, incidents, and messy ambiguous problems. Your job isn't to memorize job titles.
        It's to learn how ownership, delegation, escalation and collaboration actually work.
      </p>
      <p style="color:var(--ink-dim);font-size:13.5px;">Three stages. Nine total decisions. No wrong answers without a reason attached.</p>
      <button class="btn" onclick="startGame()">Start Simulation →</button>
    </div>
    <footer class="note">Task Compass · offline single-file simulation</footer>
  `;
}
function startGame(){
  state.s1pool = pick3(STAGE1_TASKS);
  state.s2pool = pick3(STAGE2_TASKS);
  state.s3pool = pick3(STAGE3_TASKS);
  state.screen='stage1'; state.s1idx=0;
  nextS1();
  render();
}

/* ============================= STAGE 1 ============================= */
function nextS1(){
  state.s1current = state.s1pool[state.s1idx];
  state.s1answered=false;
  state.s1assigned=null;
}
function renderStage1(){
  const t = state.s1current;
  const usedIds = state.s1assigned ? [state.s1assigned] : [];
  app.innerHTML = `
    ${headerHTML()}
    ${progressHTML()}
    <div class="panel">
      <h2 class="stage-title">Stage 1 — Who Owns This?</h2>
      <h3 class="q-count">Question ${state.s1idx+1} of 3</h3>
      <div class="ticket">
        <div class="ticket-id">${t.id}</div>
        <div class="ticket-text">${t.text}</div>
        <span class="ticket-tag">${t.tag}</span>
      </div>
      <div id="s1slot" class="slot">Drag or tap a role here as the <b>&nbsp;primary owner&nbsp;</b></div>
      <div class="role-pool" id="s1pool"></div>
      <div id="s1feedback"></div>
      <div class="btn-row">
        <button class="btn" id="s1next" style="display:none" onclick="advanceS1()">Continue →</button>
      </div>
    </div>
  `;
  const pool = document.getElementById('s1pool');
  ROLES.forEach(r=>{
    const el = document.createElement('div');
    el.className='role-card'+(usedIds.includes(r.id)?' used':'');
    el.style.setProperty('--c', r.color);
    el.draggable = true;
    el.dataset.role = r.id;
    el.innerHTML = `<span class="role-emoji">${r.emoji}</span> ${r.name}`;
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', r.id); el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    el.addEventListener('click', ()=>{ if(!state.s1answered) submitS1(r.id); });
    pool.appendChild(el);
  });
  const slot = document.getElementById('s1slot');
  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault(); slot.classList.remove('over');
    const roleId = e.dataTransfer.getData('text/plain');
    if(roleId && !state.s1answered) submitS1(roleId);
  });
}
function submitS1(roleId){
  const t = state.s1current;
  state.s1answered = true;
  state.s1assigned = roleId;
  const correct = roleId === t.owner;
  state.scores.ownership += correct ? 34 : 12;
  const slot = document.getElementById('s1slot');
  const role = R[roleId];
  slot.classList.add('filled');
  slot.innerHTML = `<div class="role-card" style="--c:${role.color}"><span class="role-emoji">${role.emoji}</span> ${role.name}</div>`;
  const ownerRole = R[t.owner];
  const fb = document.getElementById('s1feedback');
  fb.innerHTML = `
    <div class="feedback">
      <h4>${correct ? '✓ Primary Owner Confirmed' : '↻ Primary Owner: '+ownerRole.name}</h4>
      <p>${t.why}</p>
      <div class="assist-row">${t.assist.map(a=>`<span class="assist-pill">may assist: ${R[a].emoji} ${R[a].name}</span>`).join('')}</div>
    </div>`;
  document.getElementById('s1next').style.display='inline-block';
  document.querySelectorAll('#s1pool .role-card').forEach(c=> c.classList.add('used'));
}
function advanceS1(){
  state.s1idx++;
  if(state.s1idx>=3){ state.screen='stage2'; state.s2idx=0; nextS2(); }
  else nextS1();
  render();
}

/* ============================= STAGE 2 ============================= */
function nextS2(){
  state.s2current = state.s2pool[state.s2idx];
  state.s2answered=false;
  state.s2filled = new Array(state.s2current.steps.length).fill(null);
}
function renderStage2(){
  const t = state.s2current;
  app.innerHTML = `
    ${headerHTML()}
    ${progressHTML()}
    <div class="panel">
      <h2 class="stage-title">Stage 2 — Task Routing</h2>
      <h3 class="q-count">Question ${state.s2idx+1} of 3 · build the ${t.steps.length}-step workflow</h3>
      <div class="ticket">
        <div class="ticket-id">${t.id}</div>
        <div class="ticket-text">${t.text}</div>
        <span class="ticket-tag">${t.tag}</span>
      </div>
      <div class="seq-row" id="s2row"></div>
      <div class="role-pool" id="s2pool"></div>
      <div id="s2feedback"></div>
      <div class="btn-row">
        <button class="btn ghost" id="s2reset" style="display:none" onclick="resetS2()">Reset</button>
        <button class="btn" id="s2next" style="display:none" onclick="advanceS2()">Continue →</button>
      </div>
    </div>
  `;
  const row = document.getElementById('s2row');
  t.steps.forEach((_,i)=>{
    if(i>0){ const ar=document.createElement('div'); ar.className='seq-arrow'; ar.textContent='→'; row.appendChild(ar); }
    const slot = document.createElement('div');
    slot.className='seq-slot';
    slot.dataset.idx=i;
    slot.innerHTML = `<span class="step-num">STEP ${i+1}</span><span class="slot-label">drop role</span>`;
    slot.addEventListener('dragover', e=>{ if(!state.s2answered){e.preventDefault(); slot.classList.add('over');} });
    slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
    slot.addEventListener('drop', e=>{
      e.preventDefault(); slot.classList.remove('over');
      const roleId = e.dataTransfer.getData('text/plain');
      if(roleId && !state.s2answered) placeS2(i, roleId);
    });
    slot.addEventListener('click', ()=>{
      if(!state.s2answered && state.s2filled[i]){ state.s2filled[i]=null; renderStage2(); }
    });
    row.appendChild(slot);
  });
  const pool = document.getElementById('s2pool');
  const uniqueRoles = ROLES;
  uniqueRoles.forEach(r=>{
    const el = document.createElement('div');
    el.className='role-card';
    el.style.setProperty('--c', r.color);
    el.draggable = true;
    el.dataset.role = r.id;
    el.innerHTML = `<span class="role-emoji">${r.emoji}</span> ${r.name}`;
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', r.id); el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    el.addEventListener('click', ()=>{
      if(state.s2answered) return;
      const emptyIdx = state.s2filled.findIndex(x=>x===null);
      if(emptyIdx!==-1) placeS2(emptyIdx, r.id);
    });
    pool.appendChild(el);
  });
  refreshS2Slots();
}
function placeS2(idx, roleId){
  state.s2filled[idx] = roleId;
  refreshS2Slots();
  if(state.s2filled.every(x=>x!==null)) submitS2();
}
function refreshS2Slots(){
  const slots = document.querySelectorAll('#s2row .seq-slot');
  slots.forEach((slot,i)=>{
    const roleId = state.s2filled[i];
    if(roleId){
      const role = R[roleId];
      slot.classList.add('filled');
      slot.innerHTML = `<span class="step-num">STEP ${i+1}</span><div class="role-card" style="--c:${role.color};margin:0;"><span class="role-emoji">${role.emoji}</span> ${role.name}</div>`;
    } else {
      slot.classList.remove('filled');
      slot.innerHTML = `<span class="step-num">STEP ${i+1}</span><span class="slot-label">drop role</span>`;
    }
  });
}
function resetS2(){ if(state.s2answered) return; state.s2filled = new Array(state.s2current.steps.length).fill(null); refreshS2Slots(); }
function submitS2(){
  const t = state.s2current;
  state.s2answered = true;
  let correctCount = 0;
  t.steps.forEach((s,i)=>{ if(state.s2filled[i]===s) correctCount++; });
  const pct = correctCount / t.steps.length;
  state.scores.workflow += Math.round(pct*34);
  state.scores.delegation += Math.round(pct*20) + 5;

  document.getElementById('s2reset').style.display='none';
  const fb = document.getElementById('s2feedback');
  const flowHTML = t.steps.map((s,i)=>{
    const role=R[s];
    return `<div class="flow-node" style="animation-delay:${i*.25}s;border-color:${role.color}">${role.emoji} ${role.name}</div>` +
      (i<t.steps.length-1 ? `<span class="flow-arrow" style="animation-delay:${i*.25+.12}s">→</span>` : '');
  }).join('');
  fb.innerHTML = `
    <div class="feedback">
      <h4>${correctCount===t.steps.length ? '✓ Workflow matches common practice' : '↻ Here\'s how this usually routes'}</h4>
      <div class="flow-anim">${flowHTML}</div>
      <p>${t.explain}</p>
    </div>`;
  document.getElementById('s2next').style.display='inline-block';
}
function advanceS2(){
  state.s2idx++;
  if(state.s2idx>=3){ state.screen='stage3'; state.s3idx=0; nextS3(); }
  else nextS2();
  render();
}

/* ============================= STAGE 3 ============================= */
function nextS3(){
  state.s3current = state.s3pool[state.s3idx];
  state.s3answered=false;
  state.s3selected=[];
}
function renderStage3(){
  const t = state.s3current;
  app.innerHTML = `
    ${headerHTML()}
    ${progressHTML()}
    <div class="panel">
      <h2 class="stage-title">Stage 3 — Collaboration Challenge</h2>
      <h3 class="q-count">Question ${state.s3idx+1} of 3 · select up to 4 roles who should be involved</h3>
      <div class="ticket">
        <div class="ticket-id">${t.id}</div>
        <div class="ticket-text">${t.text}</div>
        <span class="ticket-tag">${t.tag}</span>
      </div>
      <div class="chip-grid" id="s3chips"></div>
      <p class="chip-count" id="s3count">0 of 4 selected</p>
      <div id="s3feedback"></div>
      <div class="btn-row">
        <button class="btn" id="s3submit" disabled onclick="submitS3()">Submit Assignment</button>
        <button class="btn" id="s3next" style="display:none" onclick="advanceS3()">Continue →</button>
      </div>
    </div>
  `;
  const grid = document.getElementById('s3chips');
  ROLES.forEach(r=>{
    const chip = document.createElement('div');
    chip.className='chip';
    chip.style.setProperty('--c', r.color);
    chip.dataset.role = r.id;
    chip.innerHTML = `<span class="role-emoji">${r.emoji}</span> ${r.name}`;
    chip.addEventListener('click', ()=>{
      if(state.s3answered) return;
      const i = state.s3selected.indexOf(r.id);
      if(i>-1){ state.s3selected.splice(i,1); chip.classList.remove('selected'); }
      else if(state.s3selected.length<4){ state.s3selected.push(r.id); chip.classList.add('selected'); }
      document.getElementById('s3count').textContent = `${state.s3selected.length} of 4 selected`;
      document.getElementById('s3submit').disabled = state.s3selected.length===0;
    });
    grid.appendChild(chip);
  });
}
function submitS3(){
  const t = state.s3current;
  state.s3answered = true;
  const chosen = state.s3selected;
  const hasPrimary = chosen.includes(t.primary);
  const supportOverlap = chosen.filter(c=>t.support.includes(c)).length;
  const idealSet = new Set([t.primary, ...t.support]);
  const correctPicks = chosen.filter(c=>idealSet.has(c)).length;

  state.scores.collaboration += Math.min(34, correctPicks*9 + (hasPrimary?7:0));
  if(chosen.length<=1) state.underCollabCount++;
  if(chosen.length>=4 && correctPicks < chosen.length) state.overAssignCount++;

  document.querySelectorAll('#s3chips .chip').forEach(chip=>{
    chip.style.pointerEvents='none';
    const rid = chip.dataset.role;
    if(rid===t.primary) chip.style.boxShadow = `0 0 0 2px ${R[rid].color}`;
  });

  const fb = document.getElementById('s3feedback');
  fb.innerHTML = `
    <div class="feedback">
      <h4>How this typically plays out</h4>
      <p><b>Primary owner:</b> ${R[t.primary].emoji} ${R[t.primary].name}</p>
      <div class="assist-row">${t.support.map(a=>`<span class="assist-pill">supporting: ${R[a].emoji} ${R[a].name}</span>`).join('')}</div>
      <p style="margin-top:14px;">${t.why}</p>
      <p style="color:var(--ink-dim);font-size:13px;"><b>Communication flow:</b> ${t.flow}</p>
    </div>`;
  document.getElementById('s3submit').style.display='none';
  document.getElementById('s3next').style.display='inline-block';
}
function advanceS3(){
  state.s3idx++;
  if(state.s3idx>=3){ state.screen='results'; }
  else nextS3();
  render();
}

/* ============================= RESULTS ============================= */
function renderResults(){
  const s = state.scores;
  const cats = [
    {key:'ownership', label:'Ownership', icon:'🎯'},
    {key:'delegation', label:'Delegation', icon:'🤝'},
    {key:'collaboration', label:'Collaboration', icon:'🧩'},
    {key:'workflow', label:'Workflow Thinking', icon:'🔀'},
  ];
  const reflections = buildReflections();
  app.innerHTML = `
    ${headerHTML('Simulation complete.')}
    <div class="panel">
      <h2 class="stage-title">Understanding Summary</h2>
      <p style="color:var(--ink-dim);font-size:13.5px;margin-top:0;">Not a score — a picture of how you think about work moving through an organization.</p>
      <div class="score-grid" id="scoreGrid">
        ${cats.map(c=>`
          <div class="score-card">
            <div class="label"><span>${c.icon} ${c.label}</span><span>${Math.min(100,Math.round(s[c.key]))}%</span></div>
            <div class="bar-track"><div class="bar-fill" data-target="${Math.min(100,Math.round(s[c.key]))}"></div></div>
          </div>`).join('')}
      </div>

      <h2 class="stage-title" style="margin-top:8px;">Final Reflection</h2>
      ${reflections.map(r=>`
        <div class="reflection-block">
          <h4>${r.title}</h4>
          <p>${r.body}</p>
        </div>`).join('')}

      <div class="btn-row">
        <button class="btn" onclick="restart()">Run Another Simulation ↻</button>
      </div>
    </div>
    <footer class="note">Task Compass · every organization routes work a little differently — this is a starting intuition, not a rulebook.</footer>
  `;
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=>{ b.style.width = b.dataset.target+'%'; });
  });
  launchConfetti();
}
function buildReflections(){
  const s = state.scores;
  const arr = [];
  const best = Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];
  const bestLabel = {ownership:'spotting who owns a task', delegation:'sequencing how work should move', collaboration:'knowing when a problem needs more than one person', workflow:'thinking in terms of process, not just people'}[best];
  arr.push({title:'What you understood well', body:`You were strongest at ${bestLabel}. That instinct carries a long way once real ambiguity shows up — most breakdowns in real teams happen exactly at these handoff points.`});

  if(state.overAssignCount>0){
    arr.push({title:'Where you tended to over-assign responsibility', body:`In a few of the larger scenarios you brought in every role available. Wide nets feel safe, but they can slow decisions down — the goal is usually the smallest group that can actually move the problem forward.`});
  } else {
    arr.push({title:'Where you tended to over-assign responsibility', body:`You generally kept your assignments focused rather than looping in everyone "just in case." That restraint tends to keep decisions moving quickly in real teams.`});
  }

  if(state.underCollabCount>0){
    arr.push({title:'Where you underestimated collaboration', body:`A few complex, org-wide problems got assigned to a single role. Those situations usually surface information that no one person holds alone — support tickets, usage data, and technical context often live with different people.`});
  } else {
    arr.push({title:'Where you underestimated collaboration', body:`You tended to recognize when a bigger problem needed multiple perspectives, which is often the harder instinct to build than picking a single owner.`});
  }

  arr.push({title:'One insight about how organizations actually work', body:`Many real workplace problems are solved by teams rather than individuals — ownership tells you who is accountable, but it rarely tells you who has to be involved to actually get there.`});
  return arr;
}
function restart(){
  state = {
    screen:'intro', workplace:state.workplace, stage:1,
    s1idx:0, s2idx:0, s3idx:0, s1pool:[], s2pool:[], s3pool:[],
    scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
    overAssignCount:0, underCollabCount:0,
  };
  render();
}
function launchConfetti(){
  const wrap = document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#4fd1c5','#5b9dff','#ffb454','#ff7bd0','#3ddc97'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.5+Math.random()*2)+'s';
    c.style.animationDelay=(Math.random()*0.6)+'s';
    wrap.appendChild(c);
  }
  setTimeout(()=>wrap.remove(), 5000);
}

render();
</script>
</body>
</html>
